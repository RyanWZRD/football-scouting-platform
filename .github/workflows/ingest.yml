name: Ingest & Score

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year to ingest"
        required: false
        default: "2025"
      max_fixtures:
        description: "Recent matches per league to pull (costs 1 API request each)"
        required: false
        default: "600"
  schedule:
    - cron: "0 2 * * *"

jobs:
  ingest-and-score:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest players/clubs/leagues
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python ingest.py --all-leagues --season ${{ github.event.inputs.season || '2025' }}

      - name: Ingest recent match stats
        env:
          FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python fixtures_ingest.py --all-leagues --season ${{ github.event.inputs.season || '2025' }} --max-fixtures ${{ github.event.inputs.max_fixtures || '600' }}

      - name: Correct club assignments using real match evidence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python fix_club_assignments.py --season ${{ github.event.inputs.season || '2025' }}

      - name: Recompute potential scores
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python scoring_model.py --season ${{ github.event.inputs.season || '2025' }}
      - name: Install matching PostgreSQL client (avoids version mismatch with Supabase's server)
        run: |
          # Confirmed directly via a real failed run: Supabase's actual
          # server is PostgreSQL 17.6, not 16 as originally assumed.
          # Installing 17 specifically here, since pg_dump requires a
          # client version >= the server's — if Supabase ever upgrades
          # again, this line will need bumping to match.
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          yes '' | sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh
          sudo apt-get install -y postgresql-client-17
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # Diagnostic — printed every run regardless of outcome, so
          # any future failure shows real, concrete evidence of which
          # binary actually ran, rather than requiring more guessing.
          echo "Available pg_dump binaries:"
          ls -la /usr/lib/postgresql/*/bin/pg_dump 2>/dev/null || echo "(none found in the usual location)"
          echo "Plain 'pg_dump' on PATH resolves to: $(which pg_dump)"
          /usr/lib/postgresql/17/bin/pg_dump --version

          # Use the full, explicit, versioned path rather than the
          # plain "pg_dump" command — confirmed the runner's default
          # PostgreSQL 16 install can coexist alongside a newly
          # installed 17, and the plain command was still silently
          # resolving to the old one via PATH regardless of what
          # version we'd actually just installed.
          mkdir -p backup_output
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" | gzip > backup_output/backup_$(date +%Y-%m-%d).sql.gz

          # A second, explicit safeguard: even with pipefail, actively
          # reject anything suspiciously small rather than trust the
          # exit code alone. A real dump of this database should
          # genuinely be several MB at minimum.
          size=$(stat -c%s backup_output/backup_$(date +%Y-%m-%d).sql.gz)
          echo "Backup file size: $size bytes"
          if [ "$size" -lt 100000 ]; then
            echo "Backup is suspiciously small ($size bytes) — treating as a failed backup, not pushing it."
            exit 1
          fi
      - name: Push backup to the private repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/RyanWZRD/football-scouting-api.git backup_repo
          mkdir -p backup_repo/backups
          cp backup_output/*.sql.gz backup_repo/backups/
          cd backup_repo
          # Keep only the 14 most recent backups so the repo doesn't grow unbounded over time.
          ls -1t backups/*.sql.gz | tail -n +15 | xargs -r rm --
          git config user.name "Automated Backup"
          git config user.email "actions@github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "Automated nightly database backup $(date +%Y-%m-%d)"
          git push
