function RecruitmentBoardModal({ onClose, onSelectPlayer }) {
  const [rows, setRows] = useState(null);
  const [sortCol, setSortCol] = useState("potential_index");
  const [sortDir, setSortDir] = useState("desc");
  const [showAll, setShowAll] = useState(false); // false = shortlist only (the real "board"), true = broader view
  const [exporting, setExporting] = useState(false);

  useEffect(() => {
    if (!API_BASE_URL) return;
    setRows(null);
    const params = new URLSearchParams({ sort: "potential", limit: "200" });
    if (!showAll) params.set("shortlist_only", "true");
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setRows(data))
      .catch(() => setRows([]));
  }, [showAll]);

  const exportCsv = () => {
    if (!API_BASE_URL) return;
    setExporting(true);
    const params = new URLSearchParams({ sort: "potential", limit: "200", format: "csv" });
    if (!showAll) params.set("shortlist_only", "true");
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.blob() : null)
      .then(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "recruitment_board.csv";
        link.click();
        URL.revokeObjectURL(url);
      })
      .catch(() => alert("Export failed — please try again."))
      .finally(() => setExporting(false));
  };

  const columns = [
    { key: "full_name", label: "Player" },
    { key: "club", label: "Club" },
    { key: "primary_position", label: "Pos" },
    { key: "age", label: "Age" },
    { key: "potential_index", label: "Potential" },
    { key: "minutes_played", label: "Mins" },
    { key: "goals", label: "G" },
    { key: "assists", label: "A" },
    { key: "pass_accuracy_pct", label: "Pass%" },
  ];

  const computeAge = (dob) => dob ? Math.floor((Date.now() - new Date(dob)) / (365.25 * 24 * 3600 * 1000)) : null;

  const sorted = rows ? [...rows].map(r => ({ ...r, age: computeAge(r.date_of_birth) })).sort((a, b) => {
    const av = a[sortCol], bv = b[sortCol];
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === "string") return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
    return sortDir === "asc" ? av - bv : bv - av;
  }) : [];

  const toggleSort = (key) => {
    if (sortCol === key) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortCol(key); setSortDir("desc"); }
  };

  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-5xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">📋 Recruitment Board</div>
          <div className="flex items-center gap-3">
            <label className="flex items-center gap-1.5 text-[10px] text-[#9AAA9E] uppercase tracking-wide">
              <input type="checkbox" checked={showAll} onChange={e => setShowAll(e.target.checked)} />
              Show all (not just shortlist)
            </label>
            <button onClick={exportCsv} disabled={exporting} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857] disabled:opacity-50">
              {exporting ? "Exporting…" : "📤 Export CSV"}
            </button>
            <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
          </div>
        </div>

        {rows === null && <div className="text-sm text-[#6B8570]">Loading…</div>}
        {rows?.length === 0 && <div className="text-sm text-[#6B8570] text-center py-4">Nothing shortlisted yet — check "Show all" or shortlist some players first.</div>}

        {rows?.length > 0 && (
          <div className="overflow-x-auto">
            <table className="w-full text-xs">
              <thead>
                <tr className="text-[#6B8570] uppercase tracking-wide border-b border-[#2C4A3B]">
                  {columns.map(c => (
                    <th key={c.key} onClick={() => toggleSort(c.key)} className="text-left py-2 px-2 cursor-pointer hover:text-[#E3A857] whitespace-nowrap">
                      {c.label} {sortCol === c.key && (sortDir === "asc" ? "↑" : "↓")}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {sorted.map(r => (
                  <tr key={r.id} onClick={() => onSelectPlayer(r)} className="border-b border-[#1C2E26] text-[#EDEDE3] hover:bg-[#152922] cursor-pointer">
                    <td className="py-2 px-2 whitespace-nowrap">{r.full_name}</td>
                    <td className="py-2 px-2 text-[#9AAA9E] whitespace-nowrap">{r.club}</td>
                    <td className="py-2 px-2">{r.primary_position}</td>
                    <td className="py-2 px-2 font-plexmono">{r.age ?? "—"}</td>
                    <td className="py-2 px-2 font-plexmono text-[#E3A857]">{r.potential_index ? Math.round(r.potential_index) : "—"}</td>
                    <td className="py-2 px-2 font-plexmono">{r.minutes_played ?? "—"}</td>
                    <td className="py-2 px-2 font-plexmono">{r.goals ?? 0}</td>
                    <td className="py-2 px-2 font-plexmono">{r.assists ?? 0}</td>
                    <td className="py-2 px-2 font-plexmono">{r.pass_accuracy_pct ?? "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function FixtureRow({ m }) {
  const [apiPrediction, setApiPrediction] = useState(null);
  const [loadingApi, setLoadingApi] = useState(false);
  const [marketOdds, setMarketOdds] = useState(null);
  const [loadingOdds, setLoadingOdds] = useState(false);
  const [fullPreviewOpen, setFullPreviewOpen] = useState(false);

  const loadApiPrediction = () => {
    if (!API_BASE_URL) return;
    setLoadingApi(true);
    fetch(`${API_BASE_URL}/fixtures/${m.id}/api-prediction`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setApiPrediction(data))
      .catch(() => setApiPrediction({ prediction: null }))
      .finally(() => setLoadingApi(false));
  };

  const loadMarketOdds = () => {
    if (!API_BASE_URL) return;
    setLoadingOdds(true);
    fetch(`${API_BASE_URL}/fixtures/${m.id}/market-odds`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : { available: false })
      .then(data => setMarketOdds(data))
      .catch(() => setMarketOdds({ available: false }))
      .finally(() => setLoadingOdds(false));
  };

  // Defensive reads — API-Football's own response shape is theirs to
  // change, so this fails gracefully (shows nothing) rather than
  // crashing if a field isn't where expected.
  const percent = apiPrediction?.prediction?.predictions?.percent;
  const [tracked, setTracked] = useState(false);

  const trackPrediction = () => {
    if (!API_BASE_URL) return;
    fetch(`${API_BASE_URL}/predictions/track`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
      body: JSON.stringify({
        match_id: m.id, predicted_home_pct: m.home_win_pct,
        predicted_draw_pct: m.draw_pct, predicted_away_pct: m.away_win_pct,
      }),
    })
      .then(res => { if (res.ok) setTracked(true); })
      .catch(() => {});
  };

  return (
    <div className="py-3 border-b border-[#1C2E26]">
      <div className="flex justify-between text-sm text-[#EDEDE3] mb-1">
        <span>{m.home_club}</span>
        <span className="text-[#6B8570] text-xs">{new Date(m.match_date).toLocaleDateString()}</span>
        <span>{m.away_club}</span>
      </div>
      {m.referee && (
        <div className="text-[10px] text-[#9AAA9E] mb-1">⚖️ Referee: {m.referee}</div>
      )}
      <div className="text-[9px] uppercase tracking-wide text-[#4A5C52] mb-1">Our estimate</div>
      <div className="flex h-2 w-full overflow-hidden">
        <div style={{ width: `${m.home_win_pct}%`, background: "#E3A857" }} />
        <div style={{ width: `${m.draw_pct}%`, background: "#6B8570" }} />
        <div style={{ width: `${m.away_win_pct}%`, background: "#7FA8D9" }} />
      </div>
      <div className="flex justify-between text-[10px] text-[#6B8570] mt-1 font-plexmono mb-2">
        <span>{m.home_win_pct}%</span>
        <span>{m.draw_pct}% draw</span>
        <span>{m.away_win_pct}%</span>
      </div>
      {!tracked ? (
        <button onClick={trackPrediction} className="block text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857] mb-2">
          📌 Track this prediction
        </button>
      ) : (
        <div className="text-[10px] text-[#7FD99A] mb-2">✓ Tracked — check Prediction Track Record after the match</div>
      )}

      {!apiPrediction && (
        <button onClick={loadApiPrediction} disabled={loadingApi} className="block text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857] disabled:opacity-50 mb-2">
          {loadingApi ? "Loading…" : "Compare against API-Football's own prediction →"}
        </button>
      )}
      {apiPrediction && !percent && (
        <div className="text-[10px] text-[#4A5C52] italic">No API-Football prediction available for this fixture.</div>
      )}
      {percent && (
        <>
          <div className="text-[9px] uppercase tracking-wide text-[#4A5C52] mb-1">API-Football's own model</div>
          <div className="flex justify-between text-[10px] text-[#7FD99A] font-plexmono">
            <span>{percent.home}</span>
            <span>{percent.draw} draw</span>
            <span>{percent.away}</span>
          </div>
        </>
      )}

      {!marketOdds && (
        <button onClick={loadMarketOdds} disabled={loadingOdds} className="block text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857] disabled:opacity-50 mt-2">
          {loadingOdds ? "Loading…" : "Compare against real betting odds →"}
        </button>
      )}
      {marketOdds && !marketOdds.available && (
        <div className="text-[10px] text-[#4A5C52] italic mt-2">{marketOdds.reason}</div>
      )}
      {marketOdds?.available && (
        <>

function TargetProfileSearchModal({ onClose, onSelectPlayer }) {
  const [profile, setProfile] = useState({
    position: "Attacker", goalsP90: "", assistsP90: "", keyPassesP90: "",
    defensiveP90: "", takeOnsP90: "", passAcc: "", ageMax: "",
  });
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);
  const [templates, setTemplates] = useState([]);
  const [savingTemplate, setSavingTemplate] = useState(false);

  const loadTemplates = () => {
    if (!API_BASE_URL) return;
    fetch(`${API_BASE_URL}/templates`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setTemplates(data))
      .catch(() => setTemplates([]));
  };

  useEffect(() => { loadTemplates(); }, []);

  const applyTemplate = (t) => {
    setProfile({
      position: t.position,
      goalsP90: t.goals_p90 ?? "", assistsP90: t.assists_p90 ?? "", keyPassesP90: t.key_passes_p90 ?? "",
      defensiveP90: t.defensive_p90 ?? "", takeOnsP90: t.take_ons_p90 ?? "", passAcc: t.pass_acc ?? "", ageMax: t.age_max ?? "",
    });
  };

  const saveTemplate = () => {
    const name = window.prompt("Name this template (e.g. 'Cheap young winger'):");
    if (!name || !name.trim()) return;
    setSavingTemplate(true);
    const body = {
      name: name.trim(), position: profile.position,
      goals_p90: profile.goalsP90 ? parseFloat(profile.goalsP90) : null,
      assists_p90: profile.assistsP90 ? parseFloat(profile.assistsP90) : null,
      key_passes_p90: profile.keyPassesP90 ? parseFloat(profile.keyPassesP90) : null,
      defensive_p90: profile.defensiveP90 ? parseFloat(profile.defensiveP90) : null,
      take_ons_p90: profile.takeOnsP90 ? parseFloat(profile.takeOnsP90) : null,
      pass_acc: profile.passAcc ? parseFloat(profile.passAcc) : null,
      age_max: profile.ageMax ? parseInt(profile.ageMax) : null,
    };
    fetch(`${API_BASE_URL}/templates`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
      body: JSON.stringify(body),
    })
      .then(res => res.ok ? loadTemplates() : null)
      .catch(() => {})
      .finally(() => setSavingTemplate(false));
  };

  const deleteTemplate = (id, e) => {
    e.stopPropagation();
    if (!window.confirm("Delete this saved template?")) return;
    fetch(`${API_BASE_URL}/templates/${id}`, { method: "DELETE", headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(() => loadTemplates())
      .catch(() => {});
  };

  const set = (key) => (e) => setProfile(prev => ({ ...prev, [key]: e.target.value }));

  const runSearch = () => {
    if (!API_BASE_URL) return;
    setLoading(true);
    const params = new URLSearchParams({ position: profile.position, limit: "20" });
    if (profile.goalsP90) params.set("goals_p90", profile.goalsP90);
    if (profile.assistsP90) params.set("assists_p90", profile.assistsP90);
    if (profile.keyPassesP90) params.set("key_passes_p90", profile.keyPassesP90);
    if (profile.defensiveP90) params.set("defensive_p90", profile.defensiveP90);
    if (profile.takeOnsP90) params.set("take_ons_p90", profile.takeOnsP90);
    if (profile.passAcc) params.set("pass_acc", profile.passAcc);
    if (profile.ageMax) params.set("age_max", profile.ageMax);

    fetch(`${API_BASE_URL}/players/target-search?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setResults(data))
      .catch(() => setResults([]))
      .finally(() => setLoading(false));
  };

  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-2xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">🎯 Target Profile Search</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>
        <div className="text-xs text-[#6B8570] mb-4 italic">
          Define exactly what you're looking for — leave fields blank you don't care about. Only filled-in dimensions count toward the match.
        </div>

        {templates.length > 0 && (
          <div className="mb-4 border border-[#2C4A3B] p-2">
            <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-1.5">📁 Saved Templates</div>
            {templates.map(t => (
              <div key={t.id} onClick={() => applyTemplate(t)}
                className="w-full flex items-center justify-between text-xs py-1.5 px-1 hover:bg-[#152922] cursor-pointer">
                <span className="text-[#EDEDE3]">{t.name} <span className="text-[#6B8570]">· {t.position}</span></span>
                <button onClick={(e) => deleteTemplate(t.id, e)} className="text-[#6B8570] hover:text-[#E36B57] px-1">✕</button>
              </div>
            ))}
          </div>
        )}

        <select value={profile.position} onChange={set("position")} className="w-full bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3] mb-3">
          <option value="Goalkeeper">Goalkeeper</option>
          <option value="Defender">Defender</option>
          <option value="Midfielder">Midfielder</option>
          <option value="Attacker">Attacker</option>
        </select>

        <div className="grid grid-cols-2 gap-3 mb-3">
          <input type="number" step="0.1" placeholder="Goals per 90" value={profile.goalsP90} onChange={set("goalsP90")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" step="0.1" placeholder="Assists per 90" value={profile.assistsP90} onChange={set("assistsP90")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" step="0.1" placeholder="Key passes per 90" value={profile.keyPassesP90} onChange={set("keyPassesP90")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" step="0.1" placeholder="Defensive actions per 90" value={profile.defensiveP90} onChange={set("defensiveP90")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" step="0.1" placeholder="Take-ons per 90" value={profile.takeOnsP90} onChange={set("takeOnsP90")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" placeholder="Pass accuracy %" value={profile.passAcc} onChange={set("passAcc")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3]" />
          <input type="number" placeholder="Max age" value={profile.ageMax} onChange={set("ageMax")} className="bg-[#152922] border border-[#2C4A3B] px-2 py-1.5 text-xs text-[#EDEDE3] col-span-2" />
        </div>

        <div className="flex gap-2 mb-4">
          <button onClick={runSearch} disabled={loading} className="flex-1 bg-[#E3A857] text-[#0E1A15] font-bold py-2 text-sm uppercase tracking-wide disabled:opacity-50">
            {loading ? "Searching…" : "Find Matches"}
          </button>
          <button onClick={saveTemplate} disabled={savingTemplate}
            className="px-4 py-2 border border-[#2C4A3B] text-[#9AAA9E] hover:border-[#E3A857] hover:text-[#E3A857] text-xs uppercase tracking-wide disabled:opacity-50">
            💾 {savingTemplate ? "Saving…" : "Save"}
          </button>
        </div>

        {results?.length === 0 && <div className="text-sm text-[#6B8570] text-center py-4">No matches — try widening the profile.</div>}
        {results?.map((r, i) => (
          <button key={r.id} onClick={() => onSelectPlayer(r)} className="w-full flex items-center justify-between text-sm py-2 border-b border-[#1C2E26] hover:bg-[#152922] text-left">
            <span className="flex items-center gap-2 text-[#EDEDE3] truncate">

              <span className="text-[#6B8570] text-xs shrink-0">· {r.club} · Age {r.age}</span>

          </button>
        ))}
      </div>
    </div>
  );
}

function LeagueReportModal({ allLeagueOptions, onClose }) {
  const [league, setLeague] = useState("");
  const [report, setReport] = useState(null);
  const [exporting, setExporting] = useState(false);
  const cardRef = useRef(null);

  useEffect(() => {
    if (!API_BASE_URL || !league) { setReport(null); return; }
    setReport(null);
    const params = new URLSearchParams({ league });
    fetch(`${API_BASE_URL}/leagues/full-report?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setReport(data))
      .catch(() => setReport(null));
  }, [league]);

  const downloadImage = () => {
    if (!cardRef.current || typeof html2canvas === "undefined") {
      alert("Image export isn't available right now — check your connection and try again.");
      return;
    }
    setExporting(true);
    html2canvas(cardRef.current, { backgroundColor: "#0E1A15", scale: 2 })
      .then(canvas => {
        const link = document.createElement("a");
        link.download = `${league.replace(/\s+/g, "_")}_full_report.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();

        const clubs = Array.from(new Set(rows.map(r => r.club).filter(Boolean))).sort();

function AuthModal({ onClose, onSuccess }) {
  const [mode, setMode] = useState("login"); // "login" | "register"
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(null);
  const [submitting, setSubmitting] = useState(false);

  const submit = async () => {
    if (!email.trim() || !password) return;
    setSubmitting(true);
    setError(null);
    try {
      const res = await fetch(`${API_BASE_URL}/auth/${mode}`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      const data = await res.json();
      if (!res.ok) {
        setError(data.detail || "Something went wrong — please try again.");
        return;
      }
      setAuthToken(data.access_token);
      onSuccess({ id: data.user_id, email: data.email });
      onClose();
    } catch (e) {
      setError("Couldn't reach the server — please try again.");
    } finally {
      setSubmitting(false);
    }
  };

  return (
    <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[80]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-sm w-full p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-5">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">
            {mode === "login" ? "🔐 Log In" : "🔐 Create Account"}
          </div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>

        <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="Email"
          className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-3"
          onKeyDown={e => e.key === "Enter" && submit()} />
        <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Password"
          className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-1"
          onKeyDown={e => e.key === "Enter" && submit()} />
        {mode === "register" && <div className="text-[10px] text-[#6B8570] mb-3">At least 8 characters.</div>}

        {error && <div className="text-xs text-[#E36B57] mt-2 mb-1">{error}</div>}

        <button onClick={submit} disabled={submitting || !email.trim() || !password}
          className="w-full bg-[#E3A857] text-[#0E1A15] font-bold py-2.5 text-sm uppercase tracking-wide mt-3 disabled:opacity-50">
          {submitting ? "…" : mode === "login" ? "Log In" : "Create Account"}
        </button>

        <button onClick={() => { setMode(mode === "login" ? "register" : "login"); setError(null); }}
          className="w-full text-center text-xs text-[#6B8570] hover:text-[#E3A857] mt-4">
          {mode === "login" ? "Need an account? Register" : "Already have an account? Log in"}
        </button>
      </div>
    </div>
  );
}

function StrategicIntelModal({ allLeagueOptions, onClose }) {
  const [league, setLeague] = useState("");
  const [aiStatus, setAiStatus] = useState("idle");
  const [briefing, setBriefing] = useState(null);
  const [generating, setGenerating] = useState(false);

  const generateBriefing = async () => {
    if (!league) return;
    setGenerating(true);
    setBriefing(null);
    setAiStatus("checking");

    const res = await fetch(`${API_BASE_URL}/leagues/strategic-briefing-data?league=${encodeURIComponent(league)}`, { headers: getAuthHeaders() });
    const data = res.ok ? await res.json() : null;
    if (!data?.available) {
      setBriefing("Not enough scored player data in this league yet to generate a briefing.");
      setGenerating(false);
      return;
    }

    const { status, session } = await getOnDeviceAISession(
      "You are a football scouting strategic analyst. Given real data about a league's top players and clubs, write a genuinely deep, coherent, multi-paragraph strategic brief: where the value is, who's trending, and what a smart club should consider next. Factual tone grounded only in the data given, no invented details."
    );
    setAiStatus(status);
    if (status !== "ready") {
      setBriefing("Chrome's on-device AI isn't available right now — needs Chrome 148+ and a one-time model download.");
      setGenerating(false);
      return;
    }

    try {
      const prompt = `League: ${data.league}\n\nTop players by potential:\n${data.top_players.map(p => `- ${p.name} (${p.club}), potential ${p.potential}`).join("\n")}\n\nTop clubs by average squad potential:\n${data.top_clubs.map(c => `- ${c.club}: ${c.avg_potential}`).join("\n")}`;
      const result = await session.prompt(prompt);
      setBriefing(result.trim());
    } catch (e) {
      setBriefing("Couldn't generate a briefing right now — please try again.");
    } finally {
      setGenerating(false);
      if (session.destroy) session.destroy();
    }
  };

  return (
    <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-2xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-8" onClick={e => e.stopPropagation()}>

        </div>
        <div className="text-xs text-[#6B8570] mb-4 italic">
          Free, runs entirely on your device — synthesizes real top-player and top-club data into a genuine strategic brief. Chrome 148+ only.
        </div>

        <select value={league} onChange={e => setLeague(e.target.value)}
          className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-3">

          {allLeagueOptions.map(l => <option key={l} value={l}>{l}</option>)}

        <button onClick={generateBriefing} disabled={!league || generating}

function TrendComparisonModal({ onClose }) {
  const [searchText, setSearchText] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [selected, setSelected] = useState([]); // up to 4 {id, full_name}
  const [data, setData] = useState(null);

  useEffect(() => {
    if (!API_BASE_URL || searchText.trim().length < 2) { setSearchResults([]); return; }
    const timer = setTimeout(() => {
      const params = new URLSearchParams({ search: searchText.trim(), limit: "10" });
      fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: getAuthHeaders() })
        .then(res => res.ok ? res.json() : [])
        .then(rows => setSearchResults(rows))
        .catch(() => setSearchResults([]));
    }, 300);
    return () => clearTimeout(timer);
  }, [searchText]);

  useEffect(() => {
    if (selected.length === 0) { setData(null); return; }
    fetch(`${API_BASE_URL}/players/trend-comparison?player_ids=${selected.map(s => s.id).join(",")}`, { headers: getAuthHeaders() })
      .then(res => res.ok ? res.json() : null)
      .then(d => setData(d))
      .catch(() => setData(null));
  }, [selected]);

  const addPlayer = (p) => {
    if (selected.length >= 4 || selected.some(s => s.id === p.id)) return;
    setSelected([...selected, { id: p.id, full_name: p.full_name }]);
    setSearchText(""); setSearchResults([]);
  };
  const removePlayer = (id) => setSelected(selected.filter(s => s.id !== id));

  const COLORS = ["#E3A857", "#7FB3D5", "#7FD99A", "#E36B57"];
  const width = 640, height = 320, padding = 40;

  const allPoints = (data?.players || []).flatMap(p => p.history.map(h => ({ ...h, value: Number(h.potential_index) })));
  const minVal = allPoints.length ? Math.min(...allPoints.map(p => p.value)) - 3 : 0;
  const maxVal = allPoints.length ? Math.max(...allPoints.map(p => p.value)) + 3 : 100;
  const allDates = allPoints.map(p => new Date(p.computed_at).getTime());
  const minDate = allDates.length ? Math.min(...allDates) : 0;
  const maxDate = allDates.length ? Math.max(...allDates) : 1;

  const scaleX = (t) => padding + ((t - minDate) / (maxDate - minDate || 1)) * (width - 2 * padding);
  const scaleY = (v) => height - padding - ((v - minVal) / (maxVal - minVal || 1)) * (height - 2 * padding);

  return (
    <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-3xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">📈 Multi-Player Trend Comparison</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>
        <div className="text-xs text-[#6B8570] mb-4 italic">Overlay up to 4 players' real potential evolution over time — the exact same history data shown individually on each dossier.</div>

        {selected.length < 4 && (
          <div className="relative mb-3">
            <input value={searchText} onChange={e => setSearchText(e.target.value)} placeholder="Search for a player to add..."
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3]" />
            {searchResults.length > 0 && (
              <div className="absolute z-10 w-full bg-[#152922] border border-[#2C4A3B] mt-1 max-h-48 overflow-y-auto">
                {searchResults.map(row => (
                  <button key={row.id} onClick={() => addPlayer(row)} className="w-full text-left px-3 py-2 text-sm text-[#EDEDE3] hover:bg-[#0E1A15]">
                    {row.full_name} <span className="text-[#6B8570] text-xs">· {row.club}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        )}

        {selected.length > 0 && (
          <div className="flex flex-wrap gap-2 mb-4">
            {selected.map((s, i) => (
              <span key={s.id} className="text-xs px-2 py-1 flex items-center gap-1.5" style={{ border: `1px solid ${COLORS[i]}`, color: COLORS[i] }}>
                {s.full_name}
                <button onClick={() => removePlayer(s.id)} className="hover:text-[#E36B57]">✕</button>
              </span>
            ))}
          </div>
        )}

        {data?.players?.length > 0 && (
          <svg viewBox={`0 0 ${width} ${height}`} className="w-full border border-[#2C4A3B]" style={{ background: "#152922" }}>
            {data.players.map((p, i) => {
              const points = p.history.map(h => `${scaleX(new Date(h.computed_at).getTime())},${scaleY(Number(h.potential_index))}`).join(" ");
              return <polyline key={p.id} points={points} fill="none" stroke={COLORS[i]} strokeWidth="2" />;
            })}
          </svg>
        )}
      </div>
    </div>
  );
}

function TransferNetworkModal({ allLeagueOptions, onClose }) {
  const [league, setLeague] = useState("");
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const svgRef = useRef(null);
  const simulationRef = useRef(null);

  const loadNetwork = () => {
    setLoading(true);
    setData(null);
    const params = new URLSearchParams({ min_transfers: "1" });
    if (league) params.set("league", league);
    fetch(`${API_BASE_URL}/clubs/transfer-network?${params.toString()}`, { headers: getAuthHeaders() })
      .then(res => res.ok ? res.json() : null)
      .then(d => setData(d))
      .catch(() => setData(null))
      .finally(() => setLoading(false));
  };

  useEffect(() => { loadNetwork(); }, []);

  useEffect(() => {
    if (!data?.available || !svgRef.current || typeof d3 === "undefined") return;
    const width = 700, height = 500;
    const svg = d3.select(svgRef.current);
    svg.selectAll("*").remove(); // clear any previous render before drawing fresh

    const nodes = data.nodes.map(n => ({ ...n }));
    const links = data.edges.map(e => ({ ...e }));

    const simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d => d.id).distance(90))
      .force("charge", d3.forceManyBody().strength(-180))
      .force("center", d3.forceCenter(width / 2, height / 2))
      .force("collide", d3.forceCollide(28));
    simulationRef.current = simulation;

    const link = svg.append("g")
      .selectAll("line")
      .data(links)
      .join("line")
      .attr("stroke", "#E3A857")
      .attr("stroke-opacity", 0.4)
      .attr("stroke-width", d => Math.min(6, 1 + d.count));

    const node = svg.append("g")
      .selectAll("circle")
      .data(nodes)
      .join("circle")
      .attr("r", 10)
      .attr("fill", "#152922")
      .attr("stroke", "#E3A857")
      .attr("stroke-width", 1.5)
      .call(d3.drag()
        .on("start", (event, d) => { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
        .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
        .on("end", (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

    const label = svg.append("g")
      .selectAll("text")
      .data(nodes)
      .join("text")
      .text(d => d.id)
      .attr("font-size", 10)
      .attr("fill", "#EDEDE3")
      .attr("dx", 14)
      .attr("dy", 4);

    simulation.on("tick", () => {
      link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
      node.attr("cx", d => d.x).attr("cy", d => d.y);
      label.attr("x", d => d.x).attr("y", d => d.y);
    });

    return () => simulation.stop();
  }, [data]);

  return (
    <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-3xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">🕸️ Club Transfer Network</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>
        <div className="text-xs text-[#6B8570] mb-4 italic">
          Real transfer flow between clubs, built from actual recorded transfers. Drag any node to explore. Line thickness reflects how many transfers have moved between two clubs.
        </div>

        <select value={league} onChange={e => { setLeague(e.target.value); }}
          className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-3">
          <option value="">All leagues combined</option>
          {allLeagueOptions.map(l => <option key={l} value={l}>{l}</option>)}
        </select>
        <button onClick={loadNetwork} disabled={loading}
          className="w-full bg-[#E3A857] text-[#0E1A15] font-bold py-2 text-sm uppercase tracking-wide mb-4 disabled:opacity-50">
          {loading ? "Loading…" : "Refresh Network"}
        </button>

        {loading && <div className="text-sm text-[#6B8570] text-center py-8">Loading transfer network…</div>}
        {data?.available === false && <div className="text-sm text-[#6B8570] text-center py-8">{data.reason}</div>}
        {data?.available && (
          <svg ref={svgRef} viewBox="0 0 700 500" className="w-full border border-[#2C4A3B]" style={{ background: "#0E1A15" }} />
        )}
      </div>
    </div>
  );
}

function AIAssistantModal({ onClose, onApplyFilters }) {
  const [aiStatus, setAiStatus] = useState("checking");
  const [query, setQuery] = useState("");
  const [thinking, setThinking] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    (async () => {
      const check = await getOnDeviceAISession();
      setAiStatus(check.status);
    })();
  }, []);

  const runQuery = async () => {
    if (!query.trim()) return;
    setThinking(true);
    setError(null);
    setResult(null);
    const systemPrompt = `You translate scouting search requests into JSON filters. Valid positions: Goalkeeper, Defender, Midfielder, Attacker. Respond with ONLY valid JSON, no other text, in this exact shape: {"position": "Defender" or null, "age_max": number or null, "potential_min": number or null}. If a field isn't mentioned, use null.`;
    const { status, session, error: sessionError } = await getOnDeviceAISession(systemPrompt);
    if (status !== "ready") {
      setError(status === "unsupported" ? "Chrome's on-device AI isn't available in this browser." : "The on-device model isn't ready right now.");
      setThinking(false);
      return;
    }
    try {
      const response = await session.prompt(query);
      const cleaned = response.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      setResult(parsed);
    } catch (e) {
      setError("Couldn't understand that as a structured search — try rephrasing.");
    } finally {
      setThinking(false);
      if (session.destroy) session.destroy();
    }
  };

  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-lg w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">🤖 AI Scouting Assistant</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>
        <div className="text-xs text-[#6B8570] mb-4 italic">
          Free, runs entirely on your device via Chrome's built-in AI — nothing sent to any server. Chrome-only (not Edge/Firefox/Safari), and needs a one-time model download the first time.
        </div>

        {aiStatus === "checking" && <div className="text-sm text-[#6B8570]">Checking availability…</div>}
        {aiStatus === "unsupported" && (
          <div className="text-sm text-[#E36B57] text-center py-4">
            Not available in this browser — Chrome's on-device AI requires Chrome 148+ specifically (not Edge, Firefox, or Safari).
          </div>
        )}
        {aiStatus === "unavailable" && <div className="text-sm text-[#E36B57] text-center py-4">Not available on this device.</div>}
        {(aiStatus === "downloading" || aiStatus === "downloadable") && (
          <div className="text-sm text-[#E3A857] text-center py-4">The model needs a one-time download — this may take a moment the first time it's used.</div>
        )}
        {aiStatus === "ready" && (
          <>
            <textarea value={query} onChange={e => setQuery(e.target.value)}
              placeholder="e.g. young left-backs with high potential"
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-3 h-20 resize-none" />
            <button onClick={runQuery} disabled={thinking}
              className="w-full bg-[#E3A857] text-[#0E1A15] font-bold py-2.5 text-sm uppercase tracking-wide mb-4 disabled:opacity-50">
              {thinking ? "Thinking…" : "🤖 Ask"}
            </button>

            {error && <div className="text-sm text-[#E36B57] text-center py-2">{error}</div>}
            {result && (
              <div className="border border-[#2C4A3B] p-3">
                <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-2">Understood as</div>
                {result.position && <div className="text-sm text-[#EDEDE3]">Position: {result.position}</div>}
                {result.age_max && <div className="text-sm text-[#EDEDE3]">Max age: {result.age_max}</div>}
                {result.potential_min && <div className="text-sm text-[#EDEDE3]">Min potential: {result.potential_min}</div>}
                <button onClick={() => { onApplyFilters(result); onClose(); }}
                  className="mt-3 w-full border border-[#E3A857] text-[#E3A857] py-2 text-xs uppercase tracking-wide hover:bg-[#E3A857] hover:text-[#0E1A15]">
                  Apply these filters
                </button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function SquadBuilderModal({ allLeagueOptions, onClose }) {
  const [comparisonLeague, setComparisonLeague] = useState("");

  const [searchText, setSearchText] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [analysis, setAnalysis] = useState(null);

  useEffect(() => {
    if (!API_BASE_URL || searchText.trim().length < 2) { setSearchResults([]); return; }
    const timer = setTimeout(() => {
      const params = new URLSearchParams({ search: searchText.trim(), limit: "10" });
      fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
        .then(res => res.ok ? res.json() : [])
        .then(rows => setSearchResults(rows))
        .catch(() => setSearchResults([]));
    }, 300);
    return () => clearTimeout(timer);
  }, [searchText]);

  useEffect(() => {
    if (!API_BASE_URL || roster.length === 0 || !comparisonLeague) { setAnalysis(null); return; }
    fetch(`${API_BASE_URL}/squad-builder/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
      body: JSON.stringify({ player_ids: roster.map(r => r.id), comparison_league: comparisonLeague }),
    })
      .then(res => res.ok ? res.json() : null)
      .then(d => setAnalysis(d))
      .catch(() => setAnalysis(null));
  }, [roster, comparisonLeague]);

  const addPlayer = (p) => {
    if (roster.some(r => r.id === p.id)) return;
    setRoster([...roster, { id: p.id, full_name: p.full_name }]);
    setSearchText("");
    setSearchResults([]);

          className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm text-[#EDEDE3] mb-3">

        <div className="relative mb-4">

function BackupRestoreModal({ onClose }) {
  const [importStatus, setImportStatus] = useState(null);
  const fileInputRef = useRef(null);

  const exportBackup = () => {
    const backup = { exported_at: new Date().toISOString(), data: {} };
    Object.keys(BACKUP_KEYS).forEach(key => {
      const value = localStorage.getItem(key);
      if (value != null) backup.data[key] = value;
    });
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `scout_index_backup_${new Date().toISOString().split("T")[0]}.json`;
    link.click();
  };

  const importBackup = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const parsed = JSON.parse(event.target.result);
        if (!parsed.data) throw new Error("Not a valid backup file");
        Object.entries(parsed.data).forEach(([key, value]) => {
          if (BACKUP_KEYS[key]) localStorage.setItem(key, value);
        });
        setImportStatus({ success: true, count: Object.keys(parsed.data).length });
      } catch (err) {
        setImportStatus({ success: false });
      }
    };
    reader.readAsText(file);
  };

  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[70]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-lg w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">💾 Backup & Restore</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>
        <div className="text-xs text-[#6B8570] mb-5 italic">
          Backs up your browser preferences — favorite clubs, saved views, Dream XI, recent menu history, and theme. Your shortlist, pipeline, and scout notes are already safely stored on the server and don't need backing up.
        </div>

        <div className="mb-6">
          <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-2">What gets backed up</div>
          {Object.entries(BACKUP_KEYS).map(([key, label]) => (
            <div key={key} className="flex items-center justify-between text-sm py-1">
              <span className="text-[#EDEDE3]">{label}</span>
              <span className="text-xs" style={{ color: localStorage.getItem(key) != null ? "#7FD99A" : "#4A5C52" }}>
                {localStorage.getItem(key) != null ? "✓ present" : "— empty"}

}

function PipelineModal({ onClose, onSelectPlayer }) {
  const [data, setData] = useState(null);

  const loadPipeline = () => {
    if (!API_BASE_URL) return;
    fetch(`${API_BASE_URL}/pipeline`, { headers: getAuthHeaders() })
      .then(res => res.ok ? res.json() : null)
      .then(d => setData(d))
      .catch(() => setData(null));
  };

  useEffect(() => { loadPipeline(); }, []);

  const moveStage = (id, newStage) => {
    fetch(`${API_BASE_URL}/pipeline/${id}/stage`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...getAuthHeaders() },
      body: JSON.stringify({ stage: newStage }),
    }).then(() => loadPipeline()).catch(() => {});
  };

  const removeTarget = (id) => {
    if (!window.confirm("Remove this target from the pipeline?")) return;
    fetch(`${API_BASE_URL}/pipeline/${id}`, { method: "DELETE", headers: getAuthHeaders() })
      .then(() => loadPipeline()).catch(() => {});
  };

  return (
    <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[70]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-5xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">📌 Recruitment Pipeline</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>

          Where each active pursuit genuinely stands. Targets sitting untouched for {data?.stale_threshold_days ?? 14}+ days in an active stage are flagged stale.

        {data === null && <div className="text-sm text-[#6B8570]">Loading…</div>}
        {data && Object.values(data.stage_counts).reduce((a, b) => a + b, 0) === 0 && (
          <div className="text-sm text-[#6B8570] text-center py-8">Nothing in the pipeline yet — add a target from any player's dossier.</div>

        {data && (

                <div key={stage.key} className="flex-1 min-w-[130px]">
                  <div className="text-[10px] uppercase tracking-wide mb-2 flex items-center justify-between" style={{ color: stage.color }}>
                    <span>{stage.label}</span>
                    <span className="font-plexmono">{data.stage_counts[stage.key] || 0}</span>

                  <div className="space-y-2">
                    {(data.stages[stage.key] || []).map(entry => (
                      <div key={entry.id} className={`border p-2 ${entry.is_stale ? "border-[#E36B57]" : "border-[#2C4A3B]"}`}>
                        <button onClick={() => onSelectPlayer(entry)} className="text-xs text-[#EDEDE3] hover:text-[#E3A857] text-left block truncate w-full">

function daysUntilKickoff() {
  const kickoff = new Date("2026-08-21T00:00:00Z");
  const diffMs = kickoff.getTime() - Date.now();
  return Math.max(0, Math.ceil(diffMs / (1000 * 60 * 60 * 24)));
}

function ClubCompareModal({ allLeagueOptions, onClose }) {
  const [league1, setLeague1] = useState("");
  const [club1, setClub1] = useState("");
  const [league2, setLeague2] = useState("");
  const [club2, setClub2] = useState("");
  const [clubs1, setClubs1] = useState([]);
  const [clubs2, setClubs2] = useState([]);
  const [squad1, setSquad1] = useState(null);
  const [squad2, setSquad2] = useState(null);

  const fetchClubsForLeague = (leagueName, setClubsFn) => {
    if (!API_BASE_URL || !leagueName) { setClubsFn([]); return; }
    const params = new URLSearchParams({ league: leagueName, limit: "3000" });
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setClubsFn(Array.from(new Set(rows.map(r => r.club).filter(Boolean))).sort()))
      .catch(() => setClubsFn([]));
  };

  useEffect(() => { fetchClubsForLeague(league1, setClubs1); setClub1(""); setSquad1(null); }, [league1]);
  useEffect(() => { fetchClubsForLeague(league2, setClubs2); setClub2(""); setSquad2(null); }, [league2]);

  const fetchSquad = (leagueName, clubName, setSquadFn) => {
    if (!API_BASE_URL || !leagueName || !clubName) return;
    const params = new URLSearchParams({ league: leagueName, limit: "3000" });
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setSquadFn(rows.filter(r => r.club === clubName)))
      .catch(() => setSquadFn([]));
  };

  useEffect(() => { if (club1) fetchSquad(league1, club1, setSquad1); }, [club1]);
  useEffect(() => { if (club2) fetchSquad(league2, club2, setSquad2); }, [club2]);

  const summarize = (squad) => {
    if (!squad) return null;
    const scored = squad.filter(p => p.potential_index != null);
    const avgPotential = scored.length ? Math.round(scored.reduce((s, p) => s + p.potential_index, 0) / scored.length) : null;
    const ages = squad.filter(p => p.date_of_birth).map(p => {
      const diff = Date.now() - new Date(p.date_of_birth).getTime();
      return Math.floor(diff / 3.15576e10);
    });
    const avgAge = ages.length ? (ages.reduce((s, a) => s + a, 0) / ages.length).toFixed(1) : null;
    const POSITION_ORDER = ["Goalkeeper", "Defender", "Midfielder", "Attacker"];
    const byPosition = Object.fromEntries(POSITION_ORDER.map(pos => [pos, squad.filter(p => p.primary_position === pos).length]));
    return { size: squad.length, avgPotential, avgAge, byPosition };
  };

  const s1 = summarize(squad1);
  const s2 = summarize(squad2);
  const POSITION_ORDER = ["Goalkeeper", "Defender", "Midfielder", "Attacker"];

  const [h2h, setH2h] = useState(null);
  const [form1, setForm1] = useState(null);
  const [form2, setForm2] = useState(null);

  useEffect(() => {
    if (!API_BASE_URL || !club1 || !club2) { setH2h(null); return; }
    const params = new URLSearchParams({ club1, club2, limit: "10" });
    fetch(`${API_BASE_URL}/h2h?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setH2h(rows))
      .catch(() => setH2h([]));
  }, [club1, club2]);

  useEffect(() => {
    if (!API_BASE_URL || !club1 || !league1) { setForm1(null); return; }
    const params = new URLSearchParams({ club: club1, league: league1 });
    fetch(`${API_BASE_URL}/clubs/form?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : { form: [] })
      .then(data => setForm1(data.form))
      .catch(() => setForm1([]));
  }, [club1, league1]);

  useEffect(() => {
    if (!API_BASE_URL || !club2 || !league2) { setForm2(null); return; }
    const params = new URLSearchParams({ club: club2, league: league2 });
    fetch(`${API_BASE_URL}/clubs/form?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : { form: [] })
      .then(data => setForm2(data.form))
      .catch(() => setForm2([]));
  }, [club2, league2]);

  const FormBadges = ({ form }) => (
    <div className="flex gap-1 justify-center">
      {(form || []).map((r, i) => (
        <span key={i} className="w-5 h-5 flex items-center justify-center text-[10px] font-bold rounded-full"
          style={{ background: r === "W" ? "#7FD99A" : r === "L" ? "#E36B57" : "#6B8570", color: "#0E1A15" }}>
          {r}
        </span>
      ))}
    </div>
  );

  return (
    <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60]" onClick={onClose}>
      <div className="bg-[#0E1A15] border border-[#E3A857] max-w-3xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-6" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">⚖ Compare Clubs</div>
          <button aria-label="Close" onClick={onClose} className="text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <select value={league1} onChange={e => setLeague1(e.target.value)}
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm outline-none text-[#EDEDE3] mb-2">
              <option value="">Select league...</option>
              {allLeagueOptions.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
            <select value={club1} onChange={e => setClub1(e.target.value)} disabled={!league1}
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm outline-none text-[#EDEDE3] disabled:opacity-50">
              <option value="">Select club...</option>
              {clubs1.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <select value={league2} onChange={e => setLeague2(e.target.value)}
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm outline-none text-[#EDEDE3] mb-2">
              <option value="">Select league...</option>
              {allLeagueOptions.map(l => <option key={l} value={l}>{l}</option>)}
            </select>
            <select value={club2} onChange={e => setClub2(e.target.value)} disabled={!league2}
              className="w-full bg-[#152922] border border-[#2C4A3B] px-3 py-2 text-sm outline-none text-[#EDEDE3] disabled:opacity-50">
              <option value="">Select club...</option>
              {clubs2.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
        </div>

        {s1 && s2 && (
          <div className="mt-6">
            <div className="grid grid-cols-2 gap-6 text-center mb-2">
              <div className="text-lg text-[#E3A857] font-display truncate">{club1}</div>
              <div className="text-lg text-[#7FB3D5] font-display truncate">{club2}</div>
            </div>
            <div className="grid grid-cols-2 gap-6 mb-4">
              <FormBadges form={form1} />
              <FormBadges form={form2} />
            </div>
            {[
              ["Squad Size", s1.size, s2.size],
              ["Avg Age", s1.avgAge ?? "—", s2.avgAge ?? "—"],
              ["Avg Potential", s1.avgPotential ?? "—", s2.avgPotential ?? "—"],
            ].map(([label, v1, v2]) => (
              <div key={label} className="grid grid-cols-2 gap-6 border-b border-[#2C4A3B] py-2.5 items-center">
                <div className="text-2xl font-plexmono text-[#E3A857] text-center">{v1}</div>
                <div className="text-2xl font-plexmono text-[#7FB3D5] text-center">{v2}</div>
                <div className="col-span-2 text-[10px] uppercase tracking-wide text-[#6B8570] text-center -mt-2">{label}</div>
              </div>
            ))}
            <div className="text-[10px] uppercase tracking-wide text-[#6B8570] text-center mt-5 mb-2">Squad Depth by Position</div>
            {POSITION_ORDER.map(pos => (
              <div key={pos} className="grid grid-cols-2 gap-6 border-b border-[#2C4A3B] py-2 items-center">
                <div className="text-lg font-plexmono text-[#E3A857] text-center">{s1.byPosition[pos]}</div>
                <div className="text-lg font-plexmono text-[#7FB3D5] text-center">{s2.byPosition[pos]}</div>
                <div className="col-span-2 text-xs text-[#6B8570] text-center -mt-1">{pos}</div>
              </div>
            ))}

            {h2h && h2h.length > 0 && (
              <>
                <div className="text-[10px] uppercase tracking-wide text-[#6B8570] text-center mt-6 mb-2">Head to Head — Last {h2h.length} Meetings</div>
                {h2h.map((m, i) => (
                  <div key={i} className="flex items-center justify-between text-xs py-1.5 border-b border-[#1C2E26]">
                    <span className="text-[#6B8570] w-20 shrink-0">{new Date(m.match_date).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "2-digit" })}</span>
                    <span className="text-[#EDEDE3] flex-1 text-center">{m.home_club} <span className="font-plexmono text-[#E3A857]">{m.home_score}–{m.away_score}</span> {m.away_club}</span>
                  </div>
                ))}
              </>
            )}
            {h2h && h2h.length === 0 && (
              <div className="text-xs text-[#6B8570] text-center mt-6">No previous meetings found in ingested data.</div>
            )}
          </div>
        )}
        {(club1 && club2 && (!s1 || !s2)) && <div className="text-sm text-[#6B8570] mt-6 text-center">Loading squads…</div>}
      </div>
    </div>
  );
}

function BriefingView({ movers, topProspects, onSelectPlayer }) {
  const HOMEPAGE_SETTINGS_KEY = "scoutindex_homepage_sections_v1";
  const DEFAULT_SECTIONS = {
    today: true, shortlistAlerts: true, shortlistInjuries: true,
    topProspects: true, shortlistHighlights: true, risers: true, transfers: true,
  };
  const [sectionSettings, setSectionSettings] = useState(() => {
    try { return { ...DEFAULT_SECTIONS, ...JSON.parse(localStorage.getItem(HOMEPAGE_SETTINGS_KEY) || "{}") }; }
    catch (e) { return DEFAULT_SECTIONS; }
  });
  const [homepageSettingsOpen, setHomepageSettingsOpen] = useState(false);
  const toggleSection = (key) => {
    setSectionSettings(prev => {
      const next = { ...prev, [key]: !prev[key] };
      try { localStorage.setItem(HOMEPAGE_SETTINGS_KEY, JSON.stringify(next)); } catch (e) { /* skip if unavailable */ }
      return next;
    });
  };

  const [transfers, setTransfers] = useState(null);
  const [shortlistHighlights, setShortlistHighlights] = useState(null);
  const [shortlistAlerts, setShortlistAlerts] = useState(null);
  const [shortlistInjuries, setShortlistInjuries] = useState(null);
  const [todayData, setTodayData] = useState(null);
  const [autonomousDiscoveries, setAutonomousDiscoveries] = useState(null);
  const THRESHOLDS_KEY = "scoutindex_potential_thresholds_v1";
  const [potentialThresholds, setPotentialThresholds] = useState(() => {
    try { return JSON.parse(localStorage.getItem(THRESHOLDS_KEY) || "{}"); } catch (e) { return {}; }
  });
  const setThresholdForPlayer = (playerId, value) => {
    const next = { ...potentialThresholds };
    if (value === null) { delete next[playerId]; } else { next[playerId] = value; }
    setPotentialThresholds(next);
    try { localStorage.setItem(THRESHOLDS_KEY, JSON.stringify(next)); } catch (e) { /* skip if unavailable */ }
  };
  const triggeredAlerts = (shortlistHighlights || []).filter(p =>
    potentialThresholds[p.id] != null && p.potential_index != null && p.potential_index >= potentialThresholds[p.id]
  );

  useEffect(() => {
    if (!API_BASE_URL) return;
    fetch(`${API_BASE_URL}/today`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(d => setTodayData(d))
      .catch(() => setTodayData(null));
    fetch(`${API_BASE_URL}/players/autonomous-discovery?limit=3`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(d => setAutonomousDiscoveries(d))
      .catch(() => setAutonomousDiscoveries(null));
    fetch(`${API_BASE_URL}/transfers?limit=5`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setTransfers(rows))
      .catch(() => setTransfers([]));
    const params = new URLSearchParams({ shortlist_only: "true", limit: "5", sort: "potential" });
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setShortlistHighlights(rows))
      .catch(() => setShortlistHighlights([]));
    fetch(`${API_BASE_URL}/shortlist/alerts?limit=5`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setShortlistAlerts(rows))
      .catch(() => setShortlistAlerts([]));
    // Broader fetch (not limited to top 5) so an injured player isn't
    // missed just because they rank outside the potential-sorted Highlights.
    // Uses data /players already returns — no new backend endpoint needed.
    const injuryParams = new URLSearchParams({ shortlist_only: "true", limit: "50", sort: "potential" });
    fetch(`${API_BASE_URL}/players?${injuryParams.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(rows => setShortlistInjuries(rows.filter(r => r.injury_type)))
      .catch(() => setShortlistInjuries([]));
  }, []);

  const Section = ({ title, children }) => (
    <div className="mb-8">
      <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-3">{title}</div>
      {children}
    </div>
  );

  const PlayerRow = ({ name, club, league, potential, photoUrl, onClick, rightExtra }) => (
    <button onClick={onClick} className="w-full flex items-center justify-between text-sm py-2 px-2 -mx-2 hover:bg-[#152922] text-left border-b border-[#1C2E26]">
      <span className="flex items-center gap-2 text-[#EDEDE3] truncate">
        <Avatar name={name} photoUrl={photoUrl} size={28} />
        <span className="truncate">{name}</span>
        <span className="text-[#6B8570] text-xs shrink-0 truncate">· {club}{league ? ` · ${league}` : ""}</span>
      </span>
      {rightExtra ?? <span className="font-plexmono shrink-0 pl-2" style={{ color: potentialColor(potential) }}>{potential ?? "—"}</span>}
    </button>
  );

  return (
    <div className="px-6 md:px-10 py-8">
      <div className="flex justify-end mb-2">
        <button onClick={() => setHomepageSettingsOpen(o => !o)} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
          ⚙ Customize Homepage
        </button>
      </div>
      {homepageSettingsOpen && (
        <div className="mb-6 border border-[#2C4A3B] p-4">
          <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-3">Show sections</div>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
            {[
              ["today", "📋 Today"], ["shortlistAlerts", "🎯 Shortlist Alerts"], ["shortlistInjuries", "🩹 Injury Watch"],
              ["topProspects", "🏆 Top Prospects"], ["shortlistHighlights", "⭐ Shortlist Highlights"],
              ["risers", "📈 Biggest Risers"], ["transfers", "🔄 Recent Transfers"],
            ].map(([key, label]) => (
              <label key={key} className="flex items-center gap-2 text-xs text-[#EDEDE3] cursor-pointer">
                <input type="checkbox" checked={sectionSettings[key]} onChange={() => toggleSection(key)} />
                {label}
              </label>
            ))}
          </div>
        </div>
      )}
      {autonomousDiscoveries?.discoveries?.length > 0 && (
        <div className="mb-8 border border-[#E3A857] bg-[#152922] p-4 sm:p-6">
          <div className="text-[10px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono mb-1">🧠 The Autonomous Scout</div>
          <div className="text-[10px] text-[#4A5C52] italic mb-4">{autonomousDiscoveries.note}</div>
          <div className="space-y-2">
            {autonomousDiscoveries.discoveries.map((d, i) => (
              <button key={d.id} onClick={() => { setLeague(d.league_display); setClub(d.club); setDeepLinkPlayerId(String(d.id)); }}
                className="w-full flex items-center justify-between text-sm py-2 border-b border-[#1C2E26] hover:bg-[#0E1A15] text-left">
                <span className="flex items-center gap-2 text-[#EDEDE3]">
                  <span className="text-[#6B8570] w-5">{i + 1}.</span>
                  {d.full_name} <span className="text-[#6B8570] text-xs">· {d.club} · {d.league_display}</span>
                  {d.momentum > 0 && <span className="text-[#7FD99A] text-xs">📈 +{d.momentum}</span>}
                </span>
                <span className="font-plexmono text-[#E3A857] shrink-0">{d.discovery_score}</span>
              </button>
            ))}
          </div>
        </div>
      )}

      {sectionSettings.today && todayData && (
        (todayData.stale_pipeline_targets?.length > 0 || todayData.workload_flags?.length > 0 ||
         todayData.upcoming_fixtures_with_referee?.length > 0 || todayData.recent_division_changes?.length > 0) && (
          <div className="mb-8 border border-[#E3A857] bg-[#152922] p-4 sm:p-6">
            <div className="text-[10px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono mb-4">📋 Today</div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-8 gap-y-4">
              {todayData.stale_pipeline_targets?.length > 0 && (
                <div>
                  <div className="text-[10px] uppercase tracking-wide text-[#E36B57] mb-1.5">📌 Stale Pipeline Targets</div>
                  {todayData.stale_pipeline_targets.slice(0, 4).map((t, i) => (
                    <div key={i} className="text-sm text-[#EDEDE3] py-0.5">{t.full_name} <span className="text-[#6B8570] text-xs">— {t.days_in_stage}d in {t.stage}</span></div>
                  ))}
                </div>
              )}
              {todayData.workload_flags?.length > 0 && (
                <div>
                  <div className="text-[10px] uppercase tracking-wide text-[#E36B57] mb-1.5">🔋 Workload Flags (Shortlist)</div>
                  {todayData.workload_flags.slice(0, 4).map((w, i) => (
                    <div key={i} className="text-sm text-[#EDEDE3] py-0.5">{w.full_name} <span className="text-[#6B8570] text-xs">— ACWR {w.acwr}</span></div>
                  ))}
                </div>
              )}
              {todayData.upcoming_fixtures_with_referee?.length > 0 && (
                <div>
                  <div className="text-[10px] uppercase tracking-wide text-[#7FB3D5] mb-1.5">⚖️ Upcoming, Referee Known</div>
                  {todayData.upcoming_fixtures_with_referee.slice(0, 4).map((f, i) => (
                    <div key={i} className="text-sm text-[#EDEDE3] py-0.5">{f.home_club} vs {f.away_club} <span className="text-[#6B8570] text-xs">— {f.referee}</span></div>
                  ))}
                </div>
              )}
              {todayData.recent_division_changes?.length > 0 && (
                <div>
                  <div className="text-[10px] uppercase tracking-wide text-[#7FD99A] mb-1.5">🔄 Division Changes Detected</div>
                  {todayData.recent_division_changes.slice(0, 4).map((d, i) => (
                    <div key={i} className="text-sm text-[#EDEDE3] py-0.5">{d.club} <span className="text-[#6B8570] text-xs">→ {d.fixture_implied_league}</span></div>
                  ))}
                </div>
              )}
            </div>
          </div>
        )
      )}

      <div className="grid grid-cols-1 md:grid-cols-2 gap-x-10">
      {sectionSettings.shortlistAlerts && (
      <Section title="🎯 Shortlist Alerts — Standout Performances">
        {shortlistAlerts === null && <div className="text-xs text-[#6B8570]">Loading…</div>}
        {shortlistAlerts?.length === 0 && <div className="text-xs text-[#6B8570]">No standout performances from your shortlist yet.</div>}
        {shortlistAlerts?.map(a => (
          <PlayerRow key={a.id} name={a.full_name} club={a.club} league={null} photoUrl={a.photo_url}
            onClick={() => onSelectPlayer({ club: a.club, id: a.id })}
            rightExtra={
              <span className="text-xs text-right shrink-0">
                <span className="text-[#E3A857]">
                  {a.goals > 0 && `⚽${a.goals > 1 ? a.goals : ""} `}
                  {a.assists > 0 && `🅰${a.assists > 1 ? a.assists : ""} `}
                  {a.rating && `${a.rating}★`}
                </span>
                <br /><span className="text-[#6B8570]">vs {a.opponent}</span>
              </span>
            } />
        ))}
      </Section>
      )}

      {sectionSettings.shortlistInjuries && shortlistInjuries && shortlistInjuries.length > 0 && (
        <Section title="🩹 Shortlist Injury Watch">
          {shortlistInjuries.map(row => (
            <PlayerRow key={row.id} name={row.full_name} club={row.club} league={null} photoUrl={row.photo_url}
              onClick={() => onSelectPlayer({ league_display: row.league_display, club: row.club, id: row.id })}
              rightExtra={
                <span className="text-xs text-right shrink-0">
                  <span className="text-[#E36B57]">{row.injury_type}</span>
                  {row.reported_date && <><br /><span className="text-[#6B8570]">as of {new Date(row.reported_date).toLocaleDateString(undefined, { day: "numeric", month: "short" })}</span></>}
                </span>
              } />
          ))}
        </Section>
      )}

      {sectionSettings.topProspects && (
      <Section title="🏆 Top Prospects Right Now">
        {topProspects.slice(0, 5).map(p => (
          <PlayerRow key={p.id} name={p.name} club={p.club} league={p.league} potential={p.potential} photoUrl={p.photoUrl}
            onClick={() => onSelectPlayer({ league_display: p.league, club: p.club, id: p.id.replace("live-", "") })} />
        ))}
      </Section>
      )}

      {sectionSettings.shortlistHighlights && (
      <Section title="⭐ Your Shortlist Highlights">
        {triggeredAlerts.length > 0 && (
          <div className="mb-3 border border-[#E3A857] bg-[#152922] p-3">
            <div className="text-[10px] uppercase tracking-wide text-[#E3A857] mb-1">🔔 Threshold Alerts</div>
            {triggeredAlerts.map(p => (
              <div key={p.id} className="text-xs text-[#EDEDE3] py-0.5">
                {p.full_name} reached potential {Math.round(p.potential_index)} (alert set at {potentialThresholds[p.id]})
              </div>
            ))}
          </div>
        )}
        {shortlistHighlights === null && <div className="text-xs text-[#6B8570]">Loading…</div>}
        {shortlistHighlights?.length === 0 && <div className="text-xs text-[#6B8570]">Nothing shortlisted yet.</div>}
        {shortlistHighlights?.map(row => (
          <div key={row.id} className="flex items-center justify-between text-sm py-1.5 border-b border-[#1C2E26]">
            <button onClick={() => onSelectPlayer({ league_display: row.league_display, club: row.club, id: row.id })}
              className="flex-1 text-left text-[#EDEDE3] hover:text-[#E3A857] truncate">
              {row.full_name} <span className="text-[#6B8570] text-xs">· {row.club}</span>
            </button>
            <span className="font-plexmono text-xs shrink-0 mr-2" style={{ color: potentialColor(row.potential_index) }}>
              {row.potential_index != null ? Math.round(row.potential_index) : "—"}
            </span>
            <button onClick={() => {
                const current = potentialThresholds[row.id];
                const input = prompt(`Alert me when ${row.full_name}'s potential reaches:`, current ?? "");
                if (input === null) return;
                const num = parseInt(input, 10);
                setThresholdForPlayer(row.id, isNaN(num) ? null : num);
              }}
              title="Set a potential threshold alert"
              className="text-[10px] shrink-0" style={{ color: potentialThresholds[row.id] != null ? "#E3A857" : "#4A5C52" }}>
              🔔{potentialThresholds[row.id] != null ? potentialThresholds[row.id] : ""}
            </button>
          </div>
        ))}
      </Section>
      )}

      {sectionSettings.risers && (
      <Section title="📈 Biggest Risers Since Last Visit">
        {(!movers || movers.risers.length === 0) && <div className="text-xs text-[#6B8570]">No movement detected yet — check back after your next visit.</div>}
        {movers?.risers.map(r => (
          <PlayerRow key={r.id} name={r.name} club={r.club} potential={r.potential} photoUrl={null}
            onClick={() => onSelectPlayer({ league_display: r.league, club: r.club, id: r.id })}
            rightExtra={<span className="font-plexmono text-[#7FD99A] shrink-0">{r.from} → {r.potential}</span>} />
        ))}
      </Section>
      )}

      {sectionSettings.transfers && (
      <Section title="🔄 Recent Transfers">
        {transfers === null && <div className="text-xs text-[#6B8570]">Loading…</div>}
        {transfers?.length === 0 && <div className="text-xs text-[#6B8570]">No transfers detected yet.</div>}
        {transfers?.map(t => (
          <PlayerRow key={`${t.player_id}-${t.changed_at}`} name={t.full_name} club={t.new_club} league={null} photoUrl={null}

      if (p.potential != null) currentSnapshot[p.id] = { potential: p.potential, name: p.name, club: p.club, league: p.league };
    });

    let result = null;
    if (prevSnapshot) {
      const risers = [];
      const newEntries = [];
      Object.entries(currentSnapshot).forEach(([id, cur]) => {
        const prev = prevSnapshot[id];
        if (!prev) {
          newEntries.push({ id, ...cur });
        } else if (cur.potential - prev.potential >= 2) {
          risers.push({ id, ...cur, delta: cur.potential - prev.potential, from: prev.potential });
        }
      });
      risers.sort((a, b) => b.delta - a.delta);
      newEntries.sort((a, b) => b.potential - a.potential);
      if (risers.length > 0 || newEntries.length > 0) {
        result = { risers: risers.slice(0, 5), newEntries: newEntries.slice(0, 5) };
      }
    }

    try {
      localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(currentSnapshot));
    } catch (e) { /* storage full or unavailable — silently skip persisting */ }

    return result;
  }

  const toggleCompare = (p) => {
    setCompareList(list => {
      if (list.find(x => x.id === p.id)) return list.filter(x => x.id !== p.id);
      if (list.length >= 4) return list;  // was >= 2, silently capping compare at 2 despite UI/ComparePanel both supporting up to 4
      return [...list, p];
    });
  };

  const toggleShortlist = async (p) => {
    if (!API_BASE_URL || !String(p.id).startsWith("live-")) return; // seed/demo players aren't real DB rows
    const realId = String(p.id).replace("live-", "");
    const newLevel = p.watchLevel === "shortlist" ? null : "shortlist";
    try {
      const res = await fetch(`${API_BASE_URL}/players/${realId}/watch`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          ...getAuthHeaders(),
        },
        body: JSON.stringify({ watch_level: newLevel, author: "dashboard" }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      setLivePlayers(prev => prev ? prev.map(pl => pl.id === p.id ? { ...pl, watchLevel: newLevel } : pl) : prev);
      setSelected(sel => sel && sel.id === p.id ? { ...sel, watchLevel: newLevel } : sel);
      logActivity(newLevel ? `Added ${p.name} to shortlist` : `Removed ${p.name} from shortlist`);
    } catch (e) {
      console.error("Failed to update shortlist status:", e);
    }
  };

  useEffect(() => {
    if (!API_BASE_URL) return;
    let cancelled = false;
    setConnectionStatus("connecting");

    const params = new URLSearchParams();
    const filtersActive = league !== "All leagues" || position !== "All positions";
    // No filters at all = a curated "top prospects" landing view, capped at
    // 200. Any filter active = a much higher cap, since a single league or
    // position can genuinely have 500-1500+ real players.
    params.set("limit", filtersActive ? "3000" : "200");
    if (league !== "All leagues") params.set("league", league);
    if (position !== "All positions") params.set("position", position);

    fetch(`${API_BASE_URL}/players?${params.toString()}`, {
      headers: API_KEY ? { "X-API-Key": API_KEY } : {}
    })
      .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(rows => {
        if (cancelled) return;
        const built = buildPercentilePlayers(rows);
        setLivePlayers(built);
        setConnectionStatus("live");
        // Only compute "since last visit" movers off the default, unfiltered
        // top-prospects view — filtered views would give a misleading,
        // scope-dependent comparison.
        if (!filtersActive) setMovers(computeMovers(built));
      })
      .catch(() => { if (!cancelled) setConnectionStatus("offline"); });
    return () => { cancelled = true; };
  }, [league, position]);

  const dataSource = livePlayers && connectionStatus === "live" ? livePlayers : PLAYERS;

  // Deep-link support: once live data is loaded, find and open the player
  // named in ?player=ID (the URL also restores league/club via the lazy
  // useState initializers above, so this works even outside the top-200).
  useEffect(() => {
    if (!deepLinkPlayerId || connectionStatus !== "live") return;
    const match = dataSource.find(p => p.id === `live-${deepLinkPlayerId}`);
    if (match) {
      selectPlayer(match);
      setDeepLinkPlayerId(null); // only auto-open once

  // While the real league list is still loading (API_BASE_URL set but
  // allLeagueOptions hasn't arrived yet), show just "All leagues" rather

  const availableLeagues = allLeagueOptions.length > 0
    ? ["All leagues", ...allLeagueOptions]

      ? ["All leagues"]
      : ["All leagues", ...Array.from(new Set(dataSource.map(p => p.league)))];
  const availablePositions = connectionStatus === "live"
    ? ["All positions", ...POSITION_OPTIONS]
    : ["All positions", ...Array.from(new Set(dataSource.map(p => p.position)))];
