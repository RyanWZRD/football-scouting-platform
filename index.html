// anywhere in the file can build authenticated headers without prop

// access gate) with the per-user Bearer token (who's actually asking).
const AUTH_TOKEN_KEY = "scoutindex_auth_token_v1";
function getAuthToken() {
  try { return localStorage.getItem(AUTH_TOKEN_KEY); } catch (e) { return null; }
}
function setAuthToken(token) {

}

  const headers = API_KEY ? { "X-API-Key": API_KEY } : {};

}

// Turns a timestamp into "3h ago", "Just now", "2d ago", etc.
function relativeTime(isoString) {
  if (!isoString) return null;
  const then = new Date(isoString).getTime();
  const diffMs = Date.now() - then;
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "Just now";
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  return `${days}d ago`;
}

function potentialColor(v) {
  if (v == null) return "#4A5C52";
  if (v >= 85) return "#E3A857";

}

// Metrics can be plain numbers (seed/demo players, already 0-100 skill scores)
// or {raw, scaled} objects (live players, real per-90 stats with a chart-only
// scaled value). These helpers read whichever shape is present.
function metricScaled(v) {
  return typeof v === "object" && v !== null ? v.scaled : v;
}
function metricRaw(v) {
  return typeof v === "object" && v !== null ? v.raw : v;
}
function metricLabel(v) {
  const raw = metricRaw(v);
  return Number.isInteger(raw) ? raw : Math.round(raw * 10) / 10;
}

// ---------------------------------------------------------------------------
// Hand-rolled SVG charts (no chart library dependency)
// ---------------------------------------------------------------------------
function polar(cx, cy, r, angleDeg) {
  const rad = (Math.PI / 180) * (angleDeg - 90);
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function RadarChart({ metrics }) {
  const entries = Object.entries(metrics);
  const n = entries.length;
  const cx = 100, cy = 85, maxR = 60;
  const angleStep = 360 / n;

  const gridRings = [0.33, 0.66, 1].map((scale, ri) => {
    const pts = entries.map((_, i) => polar(cx, cy, maxR * scale, i * angleStep));
    return <polygon key={ri} points={pts.map(p => `${p.x},${p.y}`).join(" ")}
      fill="none" stroke="#2C4A3B" strokeWidth="1" />;
  });

  const dataPts = entries.map(([, v], i) => polar(cx, cy, maxR * (Math.min(metricScaled(v), 100) / 100), i * angleStep));
  const dataPolygon = dataPts.map(p => `${p.x},${p.y}`).join(" ");

  const labels = entries.map(([k], i) => {
    const p = polar(cx, cy, maxR + 14, i * angleStep);
    return <text key={k} x={p.x} y={p.y} fill="#6B8570" fontSize="9"
      textAnchor="middle" dominantBaseline="middle">{k}</text>;
  });

  return (
    <svg viewBox="0 0 200 160" width="100%" height="100%">
      {gridRings}
      {entries.map((_, i) => {
        const p = polar(cx, cy, maxR, i * angleStep);
        return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#2C4A3B" strokeWidth="1" />;
      })}
      <polygon points={dataPolygon} fill="#E3A857" fillOpacity="0.25" stroke="#E3A857" strokeWidth="1.5" />
      {labels}
    </svg>
  );
}

// Overlays one or more players' stat shapes on the same axes — the "octagon"
// comparison view. series: [{ label, color, metrics }, ...]
function OverlayRadarChart({ series }) {
  // Union of all metric keys across every series, preserving first-seen order.
  const axes = [];
  series.forEach(s => Object.keys(s.metrics).forEach(k => { if (!axes.includes(k)) axes.push(k); }));
  const n = axes.length;
  if (n === 0) return null;
  const cx = 150, cy = 135, maxR = 95;
  const angleStep = 360 / n;

  const gridRings = [0.33, 0.66, 1].map((scale, ri) => {
    const pts = axes.map((_, i) => polar(cx, cy, maxR * scale, i * angleStep));
    return <polygon key={ri} points={pts.map(p => `${p.x},${p.y}`).join(" ")}
      fill="none" stroke="#2C4A3B" strokeWidth="1" />;
  });

  const axisLines = axes.map((_, i) => {
    const p = polar(cx, cy, maxR, i * angleStep);
    return <line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="#2C4A3B" strokeWidth="1" />;
  });

  const labels = axes.map((k, i) => {
    const p = polar(cx, cy, maxR + 20, i * angleStep);
    return <text key={k} x={p.x} y={p.y} fill="#9AAA9E" fontSize="10"
      textAnchor="middle" dominantBaseline="middle">{k}</text>;
  });

  const shapes = series.map((s, si) => {
    const pts = axes.map((k, i) => {
      const v = metricScaled(s.metrics[k] ?? 0);
      return polar(cx, cy, maxR * (Math.min(v, 100) / 100), i * angleStep);
    });
    const poly = pts.map(p => `${p.x},${p.y}`).join(" ");
    return (
      <g key={si}>
        <polygon points={poly} fill={s.color} fillOpacity="0.22" stroke={s.color} strokeWidth="2" />
        {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={s.color} />)}
      </g>
    );
  });

  return (
    <svg viewBox="0 0 300 300" width="100%" height="100%">
      {gridRings}
      {axisLines}
      {shapes}
      {labels}
    </svg>
  );
}

// Reads an axis value for a player: "Potential"/"Age" are direct fields,

function getAxisValue(p, key) {
  if (key === "Potential") return p.potential;
  if (key === "Age") return p.age;
  return metricRaw(p.metrics[key] ?? null);
}

function ScatterPlot({ players, xKey, yKey, onSelect, topProspectIds, compareIds }) {
  const width = 640, height = 440, pad = 55;
  const pts = players
    .map(p => ({ p, x: getAxisValue(p, xKey), y: getAxisValue(p, yKey) }))
    .filter(d => d.x != null && d.y != null && !isNaN(d.x) && !isNaN(d.y));

  if (pts.length === 0) {
    return (
      <div className="text-[#6B8570] text-sm p-10 text-center">
        No players have real data for both "{xKey}" and "{yKey}" yet. Try different axes or connect to live data.
      </div>
    );
  }

  const xs = pts.map(d => d.x), ys = pts.map(d => d.y);
  const xMin = Math.min(...xs), xMax = Math.max(...xs);
  const yMin = Math.min(...ys), yMax = Math.max(...ys);
  // Pad the range a bit so points don't sit right on the axis edges.
  const xPad = (xMax - xMin) * 0.1 || 1, yPad = (yMax - yMin) * 0.1 || 1;
  const xLo = xMin - xPad, xHi = xMax + xPad;
  const yLo = yMin - yPad, yHi = yMax + yPad;
  const sx = (v) => pad + ((v - xLo) / (xHi - xLo || 1)) * (width - pad - 20);
  const sy = (v) => height - pad - ((v - yLo) / (yHi - yLo || 1)) * (height - pad - 20);

  return (
    <svg viewBox={`0 0 ${width} ${height}`} width="100%" height="100%">
      {[0.25, 0.5, 0.75].map(f => (
        <line key={`h${f}`} x1={pad} x2={width - 20} y1={pad + f * (height - pad - 20)} y2={pad + f * (height - pad - 20)}
          stroke="#1C332A" strokeWidth="1" />
      ))}
      {[0.25, 0.5, 0.75].map(f => (
        <line key={`v${f}`} y1={pad} y2={height - pad} x1={pad + f * (width - pad - 20)} x2={pad + f * (width - pad - 20)}
          stroke="#1C332A" strokeWidth="1" />
      ))}
      <line x1={pad} y1={height - pad} x2={width - 20} y2={height - pad} stroke="#2C4A3B" strokeWidth="1.5" />
      <line x1={pad} y1={pad} x2={pad} y2={height - pad} stroke="#2C4A3B" strokeWidth="1.5" />
      <text x={(width + pad) / 2} y={height - 15} fill="#9AAA9E" fontSize="12" textAnchor="middle">{xKey}</text>
      <text x={16} y={(height - pad + pad) / 2} fill="#9AAA9E" fontSize="12" textAnchor="middle"
        transform={`rotate(-90 16 ${(height - pad + pad) / 2})`}>{yKey}</text>
      {pts.map(({ p, x, y }) => {
        const color = topProspectIds.has(p.id) ? "#E3A857" : compareIds.has(p.id) ? "#7FB3D5" : "#9AAA9E";
        return (
          <circle key={p.id} cx={sx(x)} cy={sy(y)} r={topProspectIds.has(p.id) ? 6 : 5}
            fill={color} fillOpacity="0.85" stroke="#0E1A15" strokeWidth="1"
            style={{ cursor: "pointer" }} onClick={() => onSelect(p)}>
            <title>{`${p.name} · ${p.club}\n${xKey}: ${Math.round(x * 100) / 100}\n${yKey}: ${Math.round(y * 100) / 100}`}</title>
          </circle>
        );
      })}
    </svg>
  );
}

// Stats where a LOWER raw number is actually better (e.g. conceding fewer

const LOWER_IS_BETTER = new Set(["Goals Conceded/90"]);

// Simple, local activity log — a genuine "what did I do this week"
// audit trail. localStorage-based since this is a personal record, not
// something needing server-side persistence or multi-device sync.
const ACTIVITY_LOG_KEY = "scoutindex_activity_log_v1";
function logActivity(action) {
  try {
    const existing = JSON.parse(localStorage.getItem(ACTIVITY_LOG_KEY) || "[]");
    const next = [{ action, timestamp: Date.now() }, ...existing].slice(0, 200); // cap at 200 entries
    localStorage.setItem(ACTIVITY_LOG_KEY, JSON.stringify(next));
  } catch (e) { /* skip if unavailable */ }
}

async function getOnDeviceAISession(systemPrompt) {
  if (!("LanguageModel" in self)) return { status: "unsupported" };
  try {
    const availability = await LanguageModel.availability();
    if (availability === "unavailable") return { status: "unavailable" };
    if (availability === "downloadable" || availability === "downloading") {
      return { status: "downloading" };
    }
    const session = await LanguageModel.create(systemPrompt ? { initialPrompts: [{ role: "system", content: systemPrompt }] } : {});
    return { status: "ready", session };
  } catch (e) {
    return { status: "error", error: e };
  }
}

    "Box-to-Box": { "Tackles/90": 0.3, "Take-ons/90": 0.3, "Goals/90": 0.25, "Pass Acc %": 0.15 },
    "Advanced Playmaker": { "Key Passes/90": 0.45, "Assists/90": 0.35, "Take-ons/90": 0.2 },
  },

    "Complete Forward": { "Goals/90": 0.35, "Assists/90": 0.3, "Take-ons/90": 0.35 },
    "Winger": { "Take-ons/90": 0.4, "Assists/90": 0.3, "Key Passes/90": 0.3 },

};

function computeRoleFitScores(metrics, position) {
  const roles = ROLE_TEMPLATES[position];
  if (!roles) return null;
  return Object.entries(roles).map(([roleName, weights]) => {
    let score = 0, totalWeight = 0;
    Object.entries(weights).forEach(([stat, w]) => {
      const scaled = metrics[stat]?.scaled;
      if (scaled != null) { score += scaled * w; totalWeight += w; }
    });
    // Genuinely normalize by the weight actually used, so a player
    // missing one stat still gets a fair score from what's available,
    // rather than being silently penalized for a data gap.
    return { role: roleName, score: totalWeight > 0 ? Math.round(score / totalWeight) : null };
  }).filter(r => r.score != null).sort((a, b) => b.score - a.score);
}

function rawStatsForRow(row) {
  const minutes = row.minutes_played || 0;
  const hasStats = minutes > 0;
  const p90 = (total) => hasStats ? (total || 0) * 90 / minutes : null;
  if (!hasStats) {
    const empty = {};
    RAW_STAT_KEYS.forEach(k => { empty[k] = null; });
    return empty;
  }
  return {
    "Goals/90": p90(row.goals),
    "Assists/90": p90(row.assists),
    "Shots on Target/90": p90(row.shots_on_target),
    "Key Passes/90": p90(row.key_passes),
    "Tackles/90": p90(row.tackles),
    "Interceptions/90": p90(row.interceptions),
    "Take-ons/90": p90(row.take_ons_completed),
    "Pass Acc %": row.pass_accuracy_pct ?? null,
    "Duel Win %": row.duel_win_pct ?? null,
    "Rating": row.avg_rating ?? null,
    "Saves/90": p90(row.saves),
    "Save %": row.save_pct ?? null,
    "Goals Conceded/90": p90(row.goals_conceded),
  };
}

// Percentile rank of `value` within `pool` (array of numbers, no nulls).
// Ties split the difference, matching standard percentile-rank convention.
function percentileRank(value, pool) {
  if (value == null || pool.length === 0) return null;
  let below = 0, equal = 0;
  for (const v of pool) {
    if (v < value) below++;
    else if (v === value) equal++;
  }
  return ((below + 0.5 * equal) / pool.length) * 100;
}

// Takes raw /players rows, returns fully-formed player objects with
// percentile-scaled metrics computed against the real ingested pool.
function buildPercentilePlayers(rows) {
  const rawStats = rows.map(rawStatsForRow);

  // Pools per position group, and an overall fallback pool, per metric.
  const positionPools = {};
  const overallPools = {};
  RAW_STAT_KEYS.forEach(k => { overallPools[k] = []; });

  rows.forEach((row, i) => {
    const pos = row.primary_position || "Unknown";
    if (!positionPools[pos]) {
      positionPools[pos] = {};
      RAW_STAT_KEYS.forEach(k => { positionPools[pos][k] = []; });
    }
    RAW_STAT_KEYS.forEach(k => {
      const v = rawStats[i][k];
      if (v != null) {
        positionPools[pos][k].push(v);
        overallPools[k].push(v);
      }
    });
  });

  return rows.map((row, i) => {
    const age = row.date_of_birth
      ? Math.floor((Date.now() - new Date(row.date_of_birth)) / 3.15576e10)
      : null;
    const minutes = row.minutes_played || 0;
    const hasStats = minutes > 0;
    const pos = row.primary_position || "Unknown";
    const raw = rawStats[i];

    const metrics = {};
    RAW_STAT_KEYS.forEach(k => {
      const posPool = positionPools[pos][k];
      const pool = posPool.length >= MIN_PEERS_FOR_POSITION_GROUP ? posPool : overallPools[k];
      let pct = percentileRank(raw[k], pool);
      if (pct != null && LOWER_IS_BETTER.has(k)) pct = 100 - pct;
      metrics[k] = { raw: raw[k] ?? 0, scaled: pct ?? 0 };
    });

    // The subset actually shown on the radar by default — relevant to this
    // player's position. Full `metrics` (all stats) stays available for
    // scatter plots, sorting, and rankings regardless of position.
    const radarKeys = POSITION_METRIC_SETS[pos] || DEFAULT_METRIC_SET;
    const radarMetrics = {};
    radarKeys.forEach(k => { if (metrics[k]) radarMetrics[k] = metrics[k]; });

    const usedPositionPeers = positionPools[pos]?.["Goals/90"]?.length >= MIN_PEERS_FOR_POSITION_GROUP;

    return {
      id: `live-${row.id}`,
      name: row.full_name,
      age,
      position: row.primary_position,
      posLabel: row.primary_position,
      club: row.club || "Unattached",
      league: row.league_display || row.league || "Unknown league",
      flag: "",
      photoUrl: row.photo_url || null,
      injury: row.injury_type ? { type: row.injury_type, reason: row.reason, date: row.reported_date } : null,
      potential: row.potential_index != null ? Math.round(row.potential_index) : null,
      marketValue: "—",
      minutesPlayed: minutes,
      appearances: row.appearances ?? null,
      seasonTotals: hasStats ? {
        "Goals": row.goals ?? 0,
        "Assists": row.assists ?? 0,
        "Shots (Total)": row.shots ?? 0,
        "Shots on Target": row.shots_on_target ?? 0,
        "Key Passes": row.key_passes ?? 0,
        "Passes (Completed/Attempted)": `${row.passes_completed ?? 0}/${row.passes_attempted ?? 0}`,
        "Tackles": row.tackles ?? 0,
        "Interceptions": row.interceptions ?? 0,
        "Take-ons (Completed/Attempted)": `${row.take_ons_completed ?? 0}/${row.take_ons_attempted ?? 0}`,
        "Duels (Won/Attempted)": `${row.duels_won ?? 0}/${row.duels_attempted ?? 0}`,
        ...(row.primary_position === "Goalkeeper" ? {
          "Saves": row.saves ?? 0,
          "Goals Conceded": row.goals_conceded ?? 0,
        } : {}),
      } : null,
      // Discipline stats were only added to ingestion recently — many
      // already-ingested matches genuinely have no data for these yet.
      // Only show the section once there's at least one real non-zero
      // value, rather than displaying a wall of placeholder zeros.
      hasDisciplineData: !!(row.yellow_cards || row.red_cards || row.fouls_committed ||
        row.fouls_drawn || row.offsides || row.penalties_won || row.penalties_scored ||
        row.penalties_missed || row.penalties_committed),
      disciplineTotals: hasStats ? {
        "Yellow Cards": row.yellow_cards ?? 0,
        "Red Cards": row.red_cards ?? 0,
        "Fouls (Committed/Drawn)": `${row.fouls_committed ?? 0}/${row.fouls_drawn ?? 0}`,
        "Offsides": row.offsides ?? 0,
        ...((row.penalties_won || row.penalties_scored || row.penalties_missed || row.penalties_committed) ? {
          "Penalties (Scored/Missed)": `${row.penalties_scored ?? 0}/${row.penalties_missed ?? 0}`,
        } : {}),
      } : null,
      metrics,
      radarMetrics,
      watchLevel: row.watch_level ?? null,
      note: !hasStats
        ? "Live record — no match data ingested yet for this player, so no real stats to show."
        : `Live record, ${Math.round(minutes)} minutes across ingested matches. Chart shows percentile rank ${usedPositionPeers ? `vs other ${pos}s` : "vs the full ingested player pool (not enough same-position peers yet)"}.`,
      tags: !hasStats ? ["No match data"] : row.potential_index != null ? [] : ["Unscored"],
    };
  });
}

function Sparkline({ points, width = 200, height = 50 }) {
  if (!points || points.length < 2) return null;
  const values = points.map(p => p.potential_index);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const stepX = width / (points.length - 1);
  const coords = values.map((v, i) => `${i * stepX},${height - ((v - min) / range) * height}`);
  const trendUp = values[values.length - 1] >= values[0];
  const color = trendUp ? "#7FD99A" : "#E36B57";
  const firstDate = new Date(points[0].computed_at).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  const lastDate = new Date(points[points.length - 1].computed_at).toLocaleDateString(undefined, { day: "numeric", month: "short" });
  return (
    <div>
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" height={height}>
        <polyline points={coords.join(" ")} fill="none" stroke={color} strokeWidth="2" />
        {coords.map((c, i) => {
          const [x, y] = c.split(",");
          return <circle key={i} cx={x} cy={y} r="2.5" fill={color} />;
        })}
      </svg>
      <div className="flex justify-between text-[10px] text-[#6B8570] mt-1">
        <span>{firstDate} · {values[0].toFixed(1)}</span>
        <span style={{ color }}>{lastDate} · {values[values.length - 1].toFixed(1)}</span>
      </div>
    </div>
  );
}

          <div style={{ fontSize: s(38), color: "#C9C08A", lineHeight: 1.5, fontStyle: "italic", padding: `0 ${s(20)}px` }}>
            "{noteText || p.note || "No note recorded."}"
          </div>
        </div>
      )}

      {variant === "similar" && (
        <div style={{ width: "100%", marginTop: s(40) }}>
          <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: s(22), letterSpacing: s(2), color: "#6B8570", textTransform: "uppercase", textAlign: "center", marginBottom: s(28) }}>
            Statistically Similar Players
          </div>
          {(similarPlayers || []).slice(0, 5).map(({ player: sp }, i) => (
            <div key={sp.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", borderBottom: "1px solid #2C4A3B", padding: `${s(20)}px 0` }}>
              <span style={{ fontSize: s(30) }}>{i + 1}. {sp.name} <span style={{ color: "#6B8570", fontSize: s(20) }}>· {sp.club}</span></span>
              <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: s(32), color: potentialColor(sp.potential) }}>{sp.potential ?? "—"}</span>
            </div>
          ))}
        </div>
      )}

      <div style={{ marginTop: s(40), fontFamily: "'IBM Plex Mono', monospace", fontSize: s(16), color: "#4A5C52", letterSpacing: s(1) }}>
        Real ingested match data · not a projection
      </div>
    </div>
  );
}

function PlayerDossier({ p, onClose, onToggleShortlist, onNavigateToPlayer }) {
  const [tab, setTab] = useState("overview");
  const [details, setDetails] = useState(null); // full dossier: real notes + trend history
  const [noteText, setNoteText] = useState("");
  const [savingNote, setSavingNote] = useState(false);
  const [expandingNote, setExpandingNote] = useState(false);
  const [aiSummary, setAiSummary] = useState(null);
  const [summarizing, setSummarizing] = useState(false);
  const [sentimentResults, setSentimentResults] = useState(null);
  const [analyzingSentiment, setAnalyzingSentiment] = useState(false);
  const analyzeSentiment = async () => {
    if (!news?.length) return;
    setAnalyzingSentiment(true);
    const { status, session } = await getOnDeviceAISession(
      `You classify football news headline sentiment. Given a numbered list of headlines, respond with ONLY a JSON array of the same length, each item exactly "positive", "negative", or "neutral" — no other text.`
    );
    if (status !== "ready") {
      alert("Chrome's on-device AI isn't available right now — needs Chrome 148+ and a one-time model download.");
      setAnalyzingSentiment(false);
      return;
    }
    try {
      const headlineList = news.map((n, i) => `${i + 1}. ${n.title}`).join("\n");
      const response = await session.prompt(headlineList);
      const cleaned = response.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      setSentimentResults(parsed);
    } catch (e) {
      alert("Couldn't analyze sentiment right now — please try again.");
    } finally {
      setAnalyzingSentiment(false);
      if (session.destroy) session.destroy();
    }
  };
  const generateAISummary = async () => {
    setSummarizing(true);
    const { status, session } = await getOnDeviceAISession(
      "You write a concise, 2-sentence scouting summary from real stats given. Factual tone, no hype, no invented details. Respond with ONLY the summary text."
    );
    if (status !== "ready") {
      setAiSummary("Chrome's on-device AI isn't available right now — needs Chrome 148+ and a one-time model download.");
      setSummarizing(false);
      return;
    }
    try {
      const statsText = `${p.name}, ${p.posLabel}, age ${p.age ?? "unknown"}, potential ${p.potential ?? "unknown"}, playing at ${p.club} in ${p.league}.`;
      const summary = await session.prompt(statsText);
      setAiSummary(summary.trim());
    } catch (e) {
      setAiSummary("Couldn't generate a summary right now.");
    } finally {
      setSummarizing(false);
      if (session.destroy) session.destroy();
    }
  };
  const expandNoteWithAI = async () => {
    if (!noteText.trim()) return;
    setExpandingNote(true);
    const { status, session } = await getOnDeviceAISession(
      "You expand short football scouting shorthand into a fuller, professional note — 2-3 sentences, factual tone, no invented details beyond what's given. Respond with ONLY the expanded note text, nothing else."
    );
    if (status !== "ready") {
      alert("Chrome's on-device AI isn't available right now — this needs Chrome 148+ and a one-time model download.");
      setExpandingNote(false);
      return;
    }
    try {
      const expanded = await session.prompt(noteText);
      setNoteText(expanded.trim());
    } catch (e) {
      alert("Couldn't expand that note — please try again.");
    } finally {
      setExpandingNote(false);
      if (session.destroy) session.destroy();
    }
  };
  const [linkCopied, setLinkCopied] = useState(false);
  const [shareCardOpen, setShareCardOpen] = useState(false);
  const [fullReportOpen, setFullReportOpen] = useState(false);
  const [exportingImage, setExportingImage] = useState(false);
  const shareCardRef = useRef(null);
  const [similarPlayers, setSimilarPlayers] = useState(null);
  const [similarLoading, setSimilarLoading] = useState(false);
  const shortlisted = p.watchLevel === "shortlist";
  const realId = String(p.id).replace("live-", "");

  // Real-Time Collaborative Notes — the honest, achievable version:
  // if a colleague saves a note for this same player while you're
  // viewing it, it appears live without a refresh. Falls back to
  // silently doing nothing if the connection fails — not a critical
  // path, just a nice-to-have.
  const [liveNoteAlert, setLiveNoteAlert] = useState(null);
  useEffect(() => {
    if (!API_BASE_URL || !realId || !String(p.id).startsWith("live-")) return;
    const wsUrl = API_BASE_URL.replace(/^http/, "ws") + `/ws/player-notes/${realId}` + (API_KEY ? `?key=${encodeURIComponent(API_KEY)}` : "");
    let ws;
    try {
      ws = new WebSocket(wsUrl);
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.new_note) {
            setDetails(d => d ? { ...d, scout_notes: [data.new_note, ...d.scout_notes] } : d);
            setLiveNoteAlert(`New note from ${data.new_note.author || "a colleague"}`);
            setTimeout(() => setLiveNoteAlert(null), 5000);
          }
        } catch (e) { /* ignore a malformed frame */ }
      };
    } catch (e) { /* WebSocket genuinely unavailable — silently skip, not a critical feature */ }
    return () => { if (ws) ws.close(); };
  }, [realId]);

  const downloadShareCard = () => {
    if (!shareCardRef.current || typeof html2canvas === "undefined") {
      alert("Image export isn't available right now — check your connection and try again.");
      return;
    }
    setExportingImage(true);
    html2canvas(shareCardRef.current, { backgroundColor: "#0E1A15", scale: 2, useCORS: true })
      .then(canvas => {
        const link = document.createElement("a");
        link.download = `${p.name.replace(/\s+/g, "_")}_${tab}_card.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      })
      .catch(() => alert("Image export failed — please try again."))
      .finally(() => setExportingImage(false));
  };

  const [exportingDossier, setExportingDossier] = useState(false);
  const fullDossierRef = useRef(null);
  const downloadFullDossier = () => {
    if (!fullDossierRef.current || typeof html2canvas === "undefined") {
      alert("Image export isn't available right now — check your connection and try again.");
      return;
    }
    setExportingDossier(true);
    html2canvas(fullDossierRef.current, { backgroundColor: "#0E1A15", scale: 2, useCORS: true })
      .then(canvas => {
        const link = document.createElement("a");
        link.download = `${p.name.replace(/\s+/g, "_")}_full_dossier.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
      })
      .catch(() => alert("Image export failed — please try again."))
      .finally(() => setExportingDossier(false));
  };

  const [projection, setProjection] = useState(null);
  const [mlTrajectory, setMlTrajectory] = useState(null);
  const [loadingMlTrajectory, setLoadingMlTrajectory] = useState(false);
  const loadMlTrajectory = () => {
    if (!API_BASE_URL) return;
    setLoadingMlTrajectory(true);
    fetch(`${API_BASE_URL}/players/${realId}/ml-trajectory`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setMlTrajectory(data))
      .catch(() => setMlTrajectory({ available: false, reason: "Failed to load." }))
      .finally(() => setLoadingMlTrajectory(false));
  };
  const [rotationRisk, setRotationRisk] = useState(null);
  useEffect(() => {
    if (!API_BASE_URL || !realId) return;
    fetch(`${API_BASE_URL}/players/${realId}/rotation-risk`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setRotationRisk(data))
      .catch(() => setRotationRisk(null));
  }, [realId]);
  const [workloadMonitor, setWorkloadMonitor] = useState(null);
  useEffect(() => {
    if (!API_BASE_URL || !realId) return;
    fetch(`${API_BASE_URL}/players/${realId}/workload-monitor`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setWorkloadMonitor(data))
      .catch(() => setWorkloadMonitor(null));
    fetch(`${API_BASE_URL}/players/${realId}/trophies`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setTrophies(data))
      .catch(() => setTrophies([]));
    fetch(`${API_BASE_URL}/players/${realId}/transfer-history`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setTransferHistory(data))
      .catch(() => setTransferHistory([]));
    fetch(`${API_BASE_URL}/players/${realId}/sidelined`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setSidelinedRecords(data))
      .catch(() => setSidelinedRecords([]));
    fetch(`${API_BASE_URL}/players/${realId}/injury-risk-profile`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setInjuryRiskProfile(data))
      .catch(() => setInjuryRiskProfile(null));
  }, [realId]);
  const [seasonHistory, setSeasonHistory] = useState(null);
  const [biography, setBiography] = useState(null);
  const [loadingBio, setLoadingBio] = useState(false);
  const loadBiography = () => {
    if (!API_BASE_URL) return;
    setLoadingBio(true);
    fetch(`${API_BASE_URL}/players/${realId}/biography`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setBiography(data))
      .catch(() => setBiography({ found: false }))
      .finally(() => setLoadingBio(false));
  };
  const [news, setNews] = useState(null);
  const [trophies, setTrophies] = useState(null);
  const [transferHistory, setTransferHistory] = useState(null);
  const [sidelinedRecords, setSidelinedRecords] = useState(null);
  const [injuryRiskProfile, setInjuryRiskProfile] = useState(null);
  const [loadingNews, setLoadingNews] = useState(false);
  const loadNews = () => {
    if (!API_BASE_URL) return;
    setLoadingNews(true);
    fetch(`${API_BASE_URL}/players/${realId}/news?limit=5`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setNews(data))
      .catch(() => setNews([]))
      .finally(() => setLoadingNews(false));
  };
  const [highlights, setHighlights] = useState(null);
  const [loadingHighlights, setLoadingHighlights] = useState(false);
  const loadHighlights = () => {
    if (!API_BASE_URL) return;
    setLoadingHighlights(true);
    fetch(`${API_BASE_URL}/players/${realId}/highlights`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setHighlights(data))
      .catch(() => setHighlights({ found: false }))
      .finally(() => setLoadingHighlights(false));
  };
  const [ratingForm, setRatingForm] = useState({ technical: 5, physical: 5, mental: 5, tactical: 5, notes: "" });
  const [savingRating, setSavingRating] = useState(false);

  const saveScoutRating = () => {
    if (!API_BASE_URL) return;
    setSavingRating(true);
    fetch(`${API_BASE_URL}/players/${realId}/scout-rating`, {
      method: "POST",
      headers: { "Content-Type": "application/json", ...(API_KEY ? { "X-API-Key": API_KEY } : {}) },
      body: JSON.stringify(ratingForm),
    })
      .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(() => {
        setRatingForm({ technical: 5, physical: 5, mental: 5, tactical: 5, notes: "" });
        return fetch(`${API_BASE_URL}/players/${realId}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} });
      })
      .then(res => res.ok ? res.json() : null)
      .then(data => { if (data) setDetails(data); })
      .catch(() => alert("Couldn't save the rating — please try again."))
      .finally(() => setSavingRating(false));
  };

  useEffect(() => {
    if (!API_BASE_URL || !String(p.id).startsWith("live-")) return;
    fetch(`${API_BASE_URL}/players/${realId}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(data => setDetails(data))
      .catch(() => setDetails(null));
    fetch(`${API_BASE_URL}/players/${realId}/projection`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : null)
      .then(data => setProjection(data))
      .catch(() => setProjection(null));
    fetch(`${API_BASE_URL}/players/${realId}/season-history`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => res.ok ? res.json() : [])
      .then(data => setSeasonHistory(data))
      .catch(() => setSeasonHistory([]));
  }, [p.id]);

  // Fetch a broad, position-matched pool and rank by similarity across all
  // real stats — lazy-loaded only when the Similar tab is actually opened.
  useEffect(() => {
    if (tab !== "similar" || similarPlayers !== null || !API_BASE_URL || !p.position) return;
    setSimilarLoading(true);
    const params = new URLSearchParams({ position: p.position, limit: "3000" });
    fetch(`${API_BASE_URL}/players?${params.toString()}`, { headers: API_KEY ? { "X-API-Key": API_KEY } : {} })
      .then(res => { if (!res.ok) throw new Error(res.status); return res.json(); })
      .then(rows => {
        const pool = buildPercentilePlayers(rows);
        const target = pool.find(x => x.id === p.id) || p;
        const keys = Object.keys(target.metrics);
        const scored = pool
          .filter(x => x.id !== p.id)
          .map(x => {
            let sumSq = 0, n = 0;
            keys.forEach(k => {
              if (target.metrics[k]?.scaled == null || x.metrics[k]?.scaled == null) return;
              const diff = target.metrics[k].scaled - x.metrics[k].scaled;
              sumSq += diff * diff;
              n++;
            });
            return { player: x, distance: n > 0 ? Math.sqrt(sumSq / n) : Infinity };
          })
          .sort((a, b) => a.distance - b.distance)
          .slice(0, 6);
        setSimilarPlayers(scored);
      })
      .catch(() => setSimilarPlayers([]))
      .finally(() => setSimilarLoading(false));
  }, [tab, p.id, p.position]);

  const saveNote = async () => {
    if (!noteText.trim() || !API_BASE_URL) return;
    setSavingNote(true);
    try {
      const res = await fetch(`${API_BASE_URL}/players/${realId}/watch`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...getAuthHeaders() },
        body: JSON.stringify({ watch_level: p.watchLevel ?? null, note: noteText.trim(), author: "dashboard" }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const savedNote = await res.json();
      setDetails(d => d ? { ...d, scout_notes: [{ note: noteText.trim(), author: "dashboard", watch_level: p.watchLevel ?? null, created_at: savedNote.created_at }, ...d.scout_notes] } : d);
      logActivity(`Added a scout note for ${p.name}`);
      setNoteText("");
    } catch (e) {
      console.error("Failed to save note:", e);
    } finally {
      setSavingNote(false);
    }
  };

  const copyPlayerLink = () => {
    const params = new URLSearchParams();
    params.set("player", realId);
    if (p.league) params.set("league", p.league);
    if (p.club && p.club !== "Unattached") params.set("club", p.club);
    const url = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    navigator.clipboard?.writeText(url);
    setLinkCopied(true);
    setTimeout(() => setLinkCopied(false), 1500);
  };

  const generateProfessionalReport = () => {
    if (typeof window.jspdf === "undefined") { alert("PDF library still loading — try again in a moment."); return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const margin = 20;
    let y = margin;

    const ensureSpace = (needed) => {
      if (y + needed > pageHeight - margin) { doc.addPage(); y = margin; }
    };
    const addHeading = (text) => {
      ensureSpace(14);
      doc.setFont("helvetica", "bold"); doc.setFontSize(13);
      doc.text(text, margin, y);
      y += 8;
      doc.setDrawColor(200); doc.line(margin, y - 4, pageWidth - margin, y - 4);
    };
    const addLine = (text, opts = {}) => {
      doc.setFont("helvetica", opts.bold ? "bold" : "normal");
      doc.setFontSize(opts.size || 10);
      const wrapped = doc.splitTextToSize(text, pageWidth - margin * 2);
      ensureSpace(wrapped.length * 5.5 + 2);
      doc.text(wrapped, margin, y);
      y += wrapped.length * 5.5 + 2;
    };

    // Header
    doc.setFont("helvetica", "bold"); doc.setFontSize(20);
    doc.text(p.name, margin, y); y += 9;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(100);
    doc.text(`${p.club || "Unattached"} · ${p.league || ""} · Age ${p.age ?? "—"} · ${p.posLabel || ""}`, margin, y);
    doc.setTextColor(0); y += 6;
    doc.setFontSize(9); doc.setTextColor(140);
    doc.text(`Generated ${new Date().toLocaleDateString()} — Cross-League Scouting Index`, margin, y);
    doc.setTextColor(0); y += 10;

    // Key stats
    addHeading("Key Stats");
    const statEntries = Object.entries(p.metrics || {}).slice(0, 8);
    statEntries.forEach(([key, val]) => addLine(`${key}: ${val?.raw ?? val?.scaled ?? "—"}`));
    if (statEntries.length === 0) addLine("No stats recorded yet.");
    y += 4;

    // Role suitability
    const roleFits = computeRoleFitScores(p.metrics, p.position);
    if (roleFits && roleFits.length > 0) {
      addHeading("Role Suitability");
      roleFits.forEach(r => addLine(`${r.role}: ${r.score}`));
      y += 4;
    }

    // Workload status
    if (workloadMonitor?.available) {
      addHeading("Workload Status");
      if (workloadMonitor.acwr != null) addLine(`ACWR: ${workloadMonitor.acwr}`);
      if (workloadMonitor.flags?.length > 0) workloadMonitor.flags.forEach(f => addLine(`⚠ ${f}`));
      y += 4;
    }

    // Rotation status
    if (rotationRisk?.available) {
      addHeading("Rotation Status");
      addLine(`${rotationRisk.tier} — ${rotationRisk.start_pct}% starts over last ${rotationRisk.matches_considered} matches`);
      y += 4;
    }

    // Similar players
    if (similarPlayers && similarPlayers.length > 0) {
      addHeading("Similar Players");
      similarPlayers.slice(0, 5).forEach(sp => addLine(`${sp.full_name} — ${sp.club || ""}`));
      y += 4;
    }

    // Scout notes
    if (details?.notes && details.notes.length > 0) {
      addHeading("Scout Notes");
      details.notes.forEach(n => {
        addLine(new Date(n.created_at).toLocaleDateString(), { bold: true, size: 9 });
        addLine(n.note);
        y += 2;
      });
    }

    doc.setFontSize(8); doc.setTextColor(150);
    doc.text("Generated from real, tracked data — not a guarantee of future performance.", margin, pageHeight - 10);

    doc.save(`${p.name.replace(/\s+/g, "_")}_scouting_report.pdf`);
  };

  const TabButton = ({ id, label }) => (
    <button onClick={() => setTab(id)}
      className={`px-4 py-2 text-xs uppercase tracking-wide border-b-2 ${
        tab === id ? "border-[#E3A857] text-[#E3A857]" : "border-transparent text-[#6B8570] hover:text-[#9AAA9E]"
      }`}>
      {label}
    </button>
  );

  return (
    <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={onClose}>
      <div className="printable-dossier bg-[#0E1A15] border border-[#E3A857] max-w-2xl w-full max-h-[90vh] overflow-y-auto p-4 sm:p-8 relative"
        onClick={e => e.stopPropagation()}>
        <button aria-label="Close" onClick={onClose} className="no-print absolute top-5 right-5 text-[#9AAA9E] hover:text-[#EDEDE3] text-xl">×</button>
        <div className="flex items-center justify-between no-print flex-wrap gap-y-2">
          <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono">Scouting Dossier</div>
          <div className="flex items-center gap-3 flex-wrap md:mr-8">
            <button onClick={() => setShareCardOpen(true)} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
              📸 Share Card
            </button>
            <button onClick={downloadFullDossier} disabled={exportingDossier}
              className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857] disabled:opacity-50">
              {exportingDossier ? "Exporting…" : "📄 Full Dossier"}
            </button>
            <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(p.name + " highlights")}`}
              target="_blank" rel="noopener noreferrer"
              className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
              🎥 Highlights
            </a>
            <button onClick={() => window.print()} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
              🖨 Print
            </button>
            <button onClick={generateProfessionalReport} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
              📄 Professional Report
            </button>
            {String(p.id).startsWith("live-") && (
              <button onClick={copyPlayerLink} className="text-[10px] uppercase tracking-wide text-[#6B8570] hover:text-[#E3A857]">
                🔗 {linkCopied ? "Copied!" : "Copy Player Link"}
              </button>
            )}
          </div>
        </div>
        <div className="text-[11px] tracking-[0.2em] uppercase text-[#E3A857] font-plexmono hidden print:block">Scouting Dossier</div>
        <div className="flex items-start justify-between mt-2 flex-wrap gap-y-3">
          <div className="flex items-center gap-4">
            <Avatar name={p.name} photoUrl={p.photoUrl} size={72} />
            <div>
              <h2 className="text-3xl text-[#EDEDE3] font-display">{p.name}</h2>
              <div className="text-[#9AAA9E] mt-1">{p.flag} {p.club} · {p.league} · Age {p.age ?? "—"} · {p.posLabel}</div>
            </div>
          </div>
          <div className="flex items-center gap-3 shrink-0">

        {tab === "stats" && (

            {details?.recent_matches?.length > 0 && (

                      ? (m.home_score > m.away_score ? "W" : m.home_score < m.away_score ? "L" : "D")

                    return (
                      <div key={i} className="flex items-center justify-between text-xs py-1.5 border-b border-[#1C2E26]">

        {tab === "notes" && (
          <div className="mt-5">
            <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-2">Structured Scout Report</div>
            <div className="border border-[#2C4A3B] p-4 mb-4">
              {["technical", "physical", "mental", "tactical"].map(dim => (

              <button onClick={saveScoutRating} disabled={savingRating}
                className="mt-2 text-xs uppercase tracking-wide px-4 py-2 bg-[#E3A857] text-[#0E1A15] font-bold disabled:opacity-40">
                {savingRating ? "Saving..." : "Save Rating"}
              </button>
            </div>

            {details?.scout_ratings?.length > 0 && (
              <div className="mb-6">
                <div className="text-[10px] uppercase tracking-wide text-[#6B8570] mb-2">Rating History</div>
                {details.scout_ratings.map(r => (
                  <div key={r.id} className="border-b border-[#2C4A3B] pb-2 mb-2">
                    <div className="flex gap-4 text-xs font-plexmono text-[#EDEDE3]">
                      <span>T:{r.technical}</span><span>P:{r.physical}</span><span>M:{r.mental}</span><span>Ta:{r.tactical}</span>
                      <span className="text-[#E3A857]">avg {((r.technical + r.physical + r.mental + r.tactical) / 4).toFixed(1)}</span>
                    </div>
                    {r.notes && <p className="text-[#C9C08A] text-sm mt-1">{r.notes}</p>}
                    <div className="text-[10px] text-[#6B8570] mt-1">{new Date(r.created_at).toLocaleDateString()}</div>
